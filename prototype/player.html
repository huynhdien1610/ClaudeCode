<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ANIMA — Prototype người chơi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Lora:wght@700&family=Noto+Sans+SC:wght@400;700&family=Noto+Sans+TC:wght@400;700&display=swap&subset=vietnamese" rel="stylesheet">
<link rel="stylesheet" href="assets/styles.css">
<style>
  /* Thanh điều khiển của prototype (không thuộc sản phẩm) */
  .proto-bar { position: sticky; top: 0; z-index: 50; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 8px 16px; background: var(--surface); border-bottom: 1px solid var(--line); }
  .proto-bar .seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: 8px; overflow: hidden; }
  .proto-bar .seg button { border: 0; background: transparent; color: var(--text-2); padding: 6px 12px; font: inherit; font-size: 13px; cursor: pointer; }
  .proto-bar .seg button.on { background: var(--ink); color: #fff; }
  .proto-bar .tag { font-size: 12px; color: var(--text-3); }
  .proto-bar label { display: flex; flex-direction: row; align-items: center; gap: 6px; font-size: 13px; }

  /* Khung chung */
  .stage { padding: 24px 16px 40px; display: flex; justify-content: center; }
  .shell { width: 100%; background: var(--bg); position: relative; }
  .topbar { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--surface); }
  .logo { font-family: var(--font-display); font-size: 19px; font-weight: 700; letter-spacing: 3px; color: var(--ink); }
  .wallet-pill { display: inline-flex; gap: 5px; align-items: baseline; padding: 4px 9px; border-radius: 6px; background: var(--surface-2); border: 1px solid var(--line); font-size: 13px; cursor: pointer; }
  .wallet-pill small { font-size: 11px; }
  .nav { display: flex; gap: 2px; }
  .nav a { text-decoration: none; color: var(--text-2); padding: 8px 12px; border-radius: 8px; font-weight: 600; font-size: 14px; display: flex; gap: 6px; align-items: center; border-bottom: 2px solid transparent; }
  .nav a.on { color: var(--text); }
  .topbar .nav a { border-radius: 0; padding: 18px 10px 16px; margin: -12px 0; }
  .topbar .nav a.on { border-bottom-color: var(--accent); }
  .content { padding: 16px; }
  .screen { display: grid; gap: 14px; }

  /* Chế độ app mobile */
  body.mode-app .shell { max-width: 390px; height: 800px; border-radius: 40px; border: 10px solid #1c1a17; box-shadow: 0 20px 50px rgba(28,26,23,.18); overflow: hidden; display: flex; flex-direction: column; }
  body.mode-app .topbar { padding-top: 16px; }
  body.mode-app .content { flex: 1; overflow-y: auto; padding-bottom: 20px; }
  body.mode-app .nav.bottom-nav { justify-content: space-around; border-top: 1px solid var(--line); background: var(--surface); padding: 6px 4px 14px; }
  body.mode-app .nav.bottom-nav a { flex-direction: column; gap: 3px; font-size: 10.5px; padding: 6px 2px; font-weight: 500; white-space: nowrap; flex: 1; min-width: 0; }
  body.mode-app .nav.bottom-nav a.on { color: var(--accent); font-weight: 700; }
  body.mode-app .topbar .nav { display: none; }
  body.mode-app .web-only { display: none !important; }
  /* Chế độ website */
  body.mode-web .shell { max-width: 1180px; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; min-height: 760px; box-shadow: var(--shadow); }
  body.mode-web .bottom-nav { display: none; }
  body.mode-web .content { padding: 24px 28px; }
  body.mode-web .app-only { display: none !important; }
  body.mode-web .cols { display: grid; grid-template-columns: 1.3fr 1fr; gap: 16px; align-items: start; }
  @media (max-width: 760px) { body.mode-web .cols { grid-template-columns: 1fr; } body.mode-web .topbar { flex-wrap: wrap; } body.mode-web .topbar .nav { order: 3; width: 100%; overflow-x: auto; } body.mode-web .topbar .nav a { margin: 0; padding: 8px 10px; } }

  .hero { border-radius: var(--radius); padding: 16px; background: var(--surface); border: 1px solid var(--line); display: flex; gap: 16px; align-items: center; }
  .pack-art { width: 92px; aspect-ratio: 2/3; border-radius: 8px; flex: none; position: relative; background: #234e52; border: 3px solid #c8a24a; display: grid; place-content: center; text-align: center; color: #f4ecd8; font-family: var(--font-display); font-weight: 700; font-size: 11px; letter-spacing: 2px; padding: 6px; }
  .pack-art::before { content: ""; position: absolute; inset: 5px; border: 1px solid rgba(244,236,216,.35); border-radius: 4px; }
  .pack-art small { display: block; font-family: var(--font); font-weight: 500; letter-spacing: 0; font-size: 10px; color: #d9cfb6; margin-top: 4px; }
  .progress { height: 6px; border-radius: 3px; background: var(--bg-2); overflow: hidden; }
  .progress > i { display: block; height: 100%; background: var(--accent); }
  .cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .cal div { border: 1px solid var(--line); border-radius: 8px; padding: 8px 2px; text-align: center; font-size: 12px; background: var(--surface); color: var(--text-2); }
  .cal div b { color: var(--coin); }
  .cal div.done { background: #edf5ef; border-color: #b9d8c3; color: var(--ok); }
  .cal div.today { border: 2px solid var(--ink); }
  .card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 10px; }
  .card-grid .card { --w: 100%; width: 100%; cursor: pointer; }
  .card-grid .count { position: absolute; right: 6px; top: 6px; z-index: 2; background: var(--text); color: #fff; border-radius: 4px; font-size: 11px; padding: 0 6px; }
  .odds td, .odds th { padding: 7px 8px; }
  .list { display: grid; gap: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .list .item { display: flex; justify-content: space-between; gap: 10px; padding: 10px 12px; border-bottom: 1px solid var(--line); background: var(--surface); font-size: 14px; }
  .list .item:last-child { border-bottom: 0; }
  .note { border: 1px solid var(--line); border-left: 3px solid var(--ink); padding: 8px 12px; background: var(--surface-2); border-radius: 6px; font-size: 13px; color: var(--text-2); }
  .note.warn { border-left-color: var(--warn); background: #fbf6ea; }
  .kv { display: grid; gap: 2px; }
  .kv b { font-size: 22px; }

  /* Mở pack — nền sáng, nhấn bằng màu rarity */
  .opening { position: absolute; inset: 0; z-index: 80; display: none; overflow: hidden; container-type: size; background: radial-gradient(circle at 50% 45%, #fffdf8 0%, #ece6d9 75%); }
  .opening.on { display: block; }
  .opening .dim { position: absolute; inset: 0; background: #f6f4ef; opacity: 0; transition: opacity .3s; pointer-events: none; }
  .opening .flash { position: absolute; inset: 0; background: var(--fc, #fff); opacity: 0; pointer-events: none; }
  .opening .caption { position: absolute; left: 0; right: 0; top: 14%; text-align: center; color: var(--text-2); font-size: 15px; padding: 0 16px; z-index: 2; }
  .opening .controls { position: absolute; top: 14px; right: 14px; display: flex; gap: 8px; z-index: 5; }
  .opening .world { position: absolute; inset: 0; display: grid; place-items: center; }
  .opening .bigpack { width: 170px; aspect-ratio: 2/3; position: relative; cursor: pointer; touch-action: none; }
  .opening .bigpack .half { position: absolute; left: 0; right: 0; height: 50%; overflow: hidden; }
  .opening .bigpack .half.top { top: 0; }
  .opening .bigpack .half.bottom { bottom: 0; }
  .opening .bigpack .half .pack-art { width: 170px; position: absolute; left: 0; font-size: 16px; }
  .opening .bigpack .half .pack-art small { font-size: 13px; }
  .opening .bigpack .half.bottom .pack-art { bottom: 0; }
  .opening .bigpack .light { position: absolute; left: -30%; right: -30%; top: 49%; height: 2%; background: var(--lc, #fff); opacity: 0; }
  .opening .row { position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-50%); display: flex; justify-content: center; gap: 2cqw; padding: 0 3cqw; flex-wrap: wrap; z-index: 2; }
  .opening .row .card { --w: min(16cqw, 120px); transition: opacity .3s; }
  .opening .row .card.faded { opacity: .25; }
  .opening .row .card.best { outline: 3px solid var(--rc); outline-offset: 4px; border-radius: 8px; }
  .opening .showcase { position: absolute; inset: 0; display: none; place-items: center; text-align: center; z-index: 3; }
  .opening .showcase .card { --w: min(46cqw, 230px); }
  .opening .showcase .title { margin-top: 18px; font-family: var(--font-display); font-size: 24px; font-weight: 700; min-height: 34px; color: var(--text); }
  .opening .showcase .rlabel { display: inline-block; margin-top: 6px; font-weight: 700; letter-spacing: 5px; font-size: 14px; padding: 4px 12px; border-radius: 4px; background: var(--rc); color: #fff; }
  .opening .summary { position: absolute; left: 0; right: 0; bottom: 8%; display: none; justify-content: center; gap: 8px; flex-wrap: wrap; padding: 0 16px; z-index: 4; }
  .particle { position: absolute; width: 5px; height: 5px; border-radius: 1px; pointer-events: none; z-index: 4; }
  .shake { animation: shake .3s ease-out; }
  @keyframes shake { 0%{transform:translate(0,0)} 20%{transform:translate(-8px,3px)} 40%{transform:translate(7px,-5px)} 60%{transform:translate(-5px,4px)} 80%{transform:translate(3px,-2px)} 100%{transform:translate(0,0)} }
  @keyframes bob { 0%,100% { transform: translateY(-4px) rotate(-5deg); } 50% { transform: translateY(4px) rotate(-5deg); } }
  @keyframes tease { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-2px)} 75%{transform:translateX(2px)} }
  .fake-ad { position: fixed; inset: 0; z-index: 90; background: #1c1a17; display: none; place-items: center; text-align: center; color: #fff; }
  .fake-ad h2, .fake-ad p { color: #fff; }
  .fake-ad small { color: #c9c2b4; }
  .fake-ad.on { display: grid; }
  @media (max-width: 480px) { .stage { padding: 0; } body.mode-app .shell { border: 0; border-radius: 0; height: auto; min-height: calc(100vh - 140px); box-shadow: none; max-width: none; overflow: visible; } body.mode-app .content { overflow: visible; } body.mode-app .nav.bottom-nav { position: sticky; bottom: 0; z-index: 20; } .opening { position: fixed; } }
</style>
</head>
<body class="mode-app">

<div class="proto-bar">
  <a href="index.html" class="btn sm ghost">← Prototype</a>
  <span class="seg" role="group" aria-label="Nền tảng">
    <button data-mode="app" class="on">App mobile</button>
    <button data-mode="web">Website</button>
  </span>
  <label class="row" style="font-size:13px;display:flex"><input type="checkbox" id="reduced"> Giảm chuyển động</label>
  <label class="row" style="font-size:13px;display:flex"><input type="checkbox" id="fast"> Fast mode</label>
  <label>Ngôn ngữ <select id="langSel"></select></label>
  <button class="btn sm ghost" id="newday">Sang ngày mới (demo)</button>
  <button class="btn sm ghost" id="reset">Đặt lại dữ liệu</button>
  <span class="tag">Dữ liệu giả, lưu trên trình duyệt này</span>
</div>

<div class="stage">
  <div class="shell" id="shell">
    <header class="topbar">
      <span class="logo">ANIMA</span>
      <nav class="nav" id="topnav"></nav>
      <span class="spacer"></span>
      <span class="wallet-pill" data-go="wallet" title="Ví"><b class="cur gem" id="gemv">0</b><small>Gem</small></span>
      <span class="wallet-pill" data-go="wallet" title="Ví"><b class="cur coin" id="coinv">0</b><small>Coin</small></span>
    </header>
    <main class="content" id="content"></main>
    <nav class="nav bottom-nav" id="bottomnav"></nav>
<!-- Màn mở pack -->
<section class="opening" id="opening" aria-live="polite">
  <div class="dim" id="dim"></div>
  <div class="controls">
    <button class="btn sm" id="skipBtn">Bỏ qua</button>
  </div>
  <div class="caption" id="caption"></div>
  <div class="world" id="world">
    <div class="bigpack" id="bigpack">
      <div class="half top"><div class="pack-art">AWAKENING<br><small>Standard</small></div></div>
      <div class="half bottom"><div class="pack-art">AWAKENING<br><small>Standard</small></div></div>
      <div class="light" id="light"></div>
    </div>
  </div>
  <div class="row" id="row"></div>
  <div class="showcase" id="showcase"></div>
  <div class="summary" id="summary">
    <button class="btn primary" id="sumAgain">Mở pack khác</button>
    <button class="btn" id="sumCollection">Xem bộ sưu tập</button>
    <button class="btn" id="sumShare">Chia sẻ</button>
    <button class="btn ghost" id="sumClose">Đóng</button>
  </div>
  <div class="flash" id="flash"></div>
  <div id="particles"></div>
</section>
  </div>
</div>



<div class="fake-ad" id="fakead"><div><h2>Quảng cáo (giả lập)</h2><p id="adtimer">3</p><small>Phần thưởng chỉ được cộng khi server nhận xác nhận từ ad network (SSV)</small></div></div>

<script src="assets/data.js"></script>
<script src="assets/i18n.js"></script>
<script>
(() => {
  const A = window.ANIMA;
  const $ = (s, el = document) => el.querySelector(s);
  const KEY = "anima-proto-v2";
  const fresh = () => ({ coin: 1300, gem: 120, pity: 17, unopened: 0, collection: {}, inst: [], issued: {}, sealed: 0, forgedToday: 0, gemFromCoinToday: 0, nonce: 1, seedHash: "9bda19bd88620c85d06a774f70f150a0379a20995f91a3525caf895375f6ccdf", revealed: [], streak: 4, checkedToday: false, day: 5,
    freeze: 1, adsToday: 0, lastAdAt: 0, ledger: [[["lg.firstLogin"], "+100 Coin"], [["lg.tutorial"], "+200 Coin"], [["lg.checkin", { n: 4 }], "+50 Coin"]],
    recent: [], phoneVerified: false, deletion: false });
  let S;
  try { S = JSON.parse(localStorage.getItem(KEY)) || fresh(); } catch (e) { S = fresh(); }
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };
  const I = window.ANIMA_I18N;
  if (!S.locale) S.locale = I.detect(navigator.language);
  let t = I.make(S.locale);
  const fmt = (n) => n.toLocaleString(I.NUMBER_LOCALE[S.locale] || "en-US");
  const rName = (key) => t("r." + key);
  function setLocale(l) { S.locale = l; t = I.make(l); document.documentElement.lang = l; const sel = document.getElementById("langSel"); if (sel) sel.value = l; save(); route(); }
  const mode = () => (document.body.classList.contains("mode-web") ? "web" : "app");
  const reduced = () => $("#reduced").checked;
  if (window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) $("#reduced").checked = true;

  function toast(msg, err) {
    const t = document.createElement("div");
    t.className = "toast" + (err ? " err" : "");
    t.innerHTML = msg;
    document.body.appendChild(t);
    setTimeout(() => t.remove(), 2600);
  }
  const ICON = {
    home: '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>',
    store: '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6"/></svg>',
    collection: '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="9" rx="1"/><rect x="3" y="15" width="7" height="6" rx="1"/><rect x="14" y="15" width="7" height="6" rx="1"/></svg>',
    rewards: '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
    forge: '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10h11l3-3h2v4l-3 3v1H7l-3-3z"/><path d="M8 15v3M14 15v3M6 21h10"/></svg>',
    account: '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>',
  };
  const NAV = [["home", "nav.home"], ["store", "nav.store"], ["collection", "nav.collection"], ["forge", "nav.forge"], ["rewards", "nav.rewards", "nav.rewardsShort"], ["account", "nav.account"]];
  function renderNav(cur) {
    const link = (short) => NAV.map(([k, l, sl]) => `<a href="#${k}" class="${cur === k ? "on" : ""}">${ICON[k]}${t(short && sl ? sl : l)}</a>`).join("");
    $("#topnav").innerHTML = link(false);
    $("#bottomnav").innerHTML = link(true);
    $("#gemv").textContent = fmt(S.gem);
    $("#coinv").textContent = fmt(S.coin);
  }
  function cardHTML(c, { flipped = true, locked = false, count = 0, w = "" } = {}) {
    const el = A.ELEMENTS[c.element], r = A.RARITIES[A.rarityIndex(c.rarity)];
    const holo = A.rarityIndex(c.rarity) >= 2 && !locked ? " holo" : "";
    return `<div class="card rarity-${c.rarity}${flipped ? " flipped" : ""}${locked ? " locked" : ""}${holo}" data-card="${c.id}" style="--hue:${el.hue};${w ? "--w:" + w : ""}">
      ${count > 1 ? `<span class="count">×${count}</span>` : ""}
      <div class="inner"><div class="back">A</div>
      <div class="face"><div class="art">${locked ? "?" : el.glyph}</div>
      <div class="name">${locked ? "???" : c.name}</div>
      <div class="meta"><span>${c.element}</span><span class="rarity-text">${rName(c.rarity)}</span></div></div></div></div>`;
  }
  const owned = () => Object.keys(S.collection).length;
  /* Mỗi thẻ là một bản duy nhất: serial + số thứ tự trong edition (BR-SUP-02). */
  function addCard(c) {
    const max = A.MAX_SUPPLY[c.rarity];
    if (S.issued[c.id] === undefined) S.issued[c.id] = Math.floor(max * (0.2 + ((c.id * 37) % 50) / 100));
    S.issued[c.id] = Math.min(S.issued[c.id] + 1, max);
    const serial = "AW1-" + String(c.id).padStart(3, "0") + "-" + String(S.issued[c.id]).padStart(5, "0");
    S.inst.push({ serial, id: c.id, ed: S.issued[c.id] });
    S.collection[c.id] = (S.collection[c.id] || 0) + 1;
    return S.inst[S.inst.length - 1];
  }
  function burnCard(serial) {
    const i = S.inst.findIndex((x) => x.serial === serial);
    if (i < 0) return;
    const id = S.inst[i].id; S.inst.splice(i, 1);
    S.collection[id] -= 1; if (S.collection[id] <= 0) delete S.collection[id];
  }
  const edLabel = (x) => `#${fmt(x.ed)}/${fmt(A.MAX_SUPPLY[A.cards.find((c) => c.id === x.id).rarity])}`;
  const total = A.cards.length;

  /* ---------- Màn hình ---------- */
  const screens = {
    home() {
      const best = S.recent.slice(0, 5).map((id) => A.cards.find((c) => c.id === id));
      return `<div class="screen">
        <div><h1>${t("home.hello")}</h1><p>${t("home.heartsong")}</p></div>
        <div class="hero"><div class="pack-art">AWAKENING<br><small>Standard</small></div>
          <div><h2>${t("home.set")}</h2><p>${t("home.packInfo", { coin: fmt(1000), gem: fmt(100) })}</p>
          <div class="row wrap"><a class="btn primary" href="#pack">${t("btn.openPack")}</a><span class="chip">Pity ${S.pity}/50</span></div></div></div>
        <div class="cols">
          <div class="panel"><div class="row"><h3>${t("home.progress")}</h3><span class="spacer"></span><b>${owned()}/${total}</b></div>
            <div class="progress"><i style="width:${(owned() / total) * 100}%"></i></div>
            <small>${t("home.sampleNote", { n: total })}</small></div>
          <div class="panel app-only"><div class="row"><h3>${t("home.streak", { n: S.streak })}</h3><span class="spacer"></span><a class="btn sm" href="#rewards">${S.checkedToday ? t("btn.checkedIn") : t("btn.checkin")}</a></div>
            <small>${t("home.adsToday")}: ${S.adsToday}/10</small></div>
          <div class="panel web-only"><h3>${t("home.streak", { n: S.streak })}</h3>
            <div class="note">${t("home.webOnlyApp")}</div></div>
        </div>
        <div class="panel"><div class="row"><div><h3>${t("home.arena")}</h3><p style="margin:0">${t("home.arenaDesc")}</p></div><span class="spacer"></span><a class="btn" href="battle.html">${t("btn.enterArena")}</a></div></div>
        <div class="panel"><div class="row"><div><h3>${t("nav.forge")}</h3><p style="margin:0">${t("home.forgeDesc")}</p></div><span class="spacer"></span><a class="btn" href="#forge">${t("btn.enterForge")}</a></div></div>
        <div class="panel"><h3>${t("home.recent")}</h3>${best.length ? `<div class="card-grid">${best.map((c) => cardHTML(c)).join("")}</div>` : `<p>${t("home.noPulls")}</p>`}</div>
      </div>`;
    },
    store() {
      return `<div class="screen"><h1>${t("nav.store")}</h1>
        <div class="hero"><div class="pack-art">AWAKENING<br><small>Standard</small></div>
          <div><h2>Awakening Standard</h2><p>${t("store.desc")}</p>
          <div class="row wrap"><a class="btn primary" href="#pack">${t("btn.details")}</a><span class="chip"><b class="cur coin">${fmt(1000)}</b> Coin</span><span class="chip"><b class="cur gem">100</b> Gem</span></div></div></div>
        <div class="panel"><div class="row"><div class="pack-art" style="width:64px;font-size:10px;border-color:#a78bfa">PREMIUM</div>

          <div class="cal">${cal}</div>
          <p style="margin-top:8px">${t("rw.next")}: <b>${t("unit.days", { n: next })}</b> (+${{ 14: fmt(200), 30: fmt(1000), 100: fmt(5000) + " Coin + " + t("rw.exclusive") }[next]}${next === 100 ? "" : " Coin"})</p>
          <div class="row wrap"><button class="btn primary" id="checkin" ${S.checkedToday ? "disabled" : ""}>${S.checkedToday ? t("btn.checkedToday") : t("btn.checkinPlus", { n: vals[pos] })}</button>

        <div class="panel"><div class="row"><h3>${t("rw.ads")}</h3><span class="spacer"></span><b>${S.adsToday}/10</b></div>
          <p>${t("rw.adsDesc")}</p>
          <div class="row wrap"><button class="btn primary" id="watchAd" ${S.adsToday >= 10 || cd > 0 ? "disabled" : ""}>${S.adsToday >= 10 ? t("btn.noAds") : cd > 0 ? t("btn.wait", { n: cd }) : t("rw.ads")}</button>
          ${cd > 0 && S.adsToday < 10 ? `<button class="btn ghost sm" id="skipCd">${t("btn.skipCd")}</button>` : ""}</div></div>
      </div>`;
    },
    forge() {
      const sel = screens._forgeSel || [];
      const lim = S.phoneVerified ? 100 : 5;
      const items = S.inst.slice().sort((a, b) => A.rarityIndex(A.cards.find((c) => c.id === a.id).rarity) - A.rarityIndex(A.cards.find((c) => c.id === b.id).rarity));
      const odds = A.RARITIES.map((r) => `<tr class="rarity-${r.key}"><td><span class="rarity-text">${rName(r.key)}</span></td><td style="text-align:right">${r.odds}%</td></tr>`).join("");
      return `<div class="screen"><h1>${t("nav.forge")}</h1>
        <p>${t("fg.desc")}</p>
        <div class="cols">
          <div class="panel"><div class="row"><h3>${t("fg.pick")} (${sel.length}/2)</h3><span class="spacer"></span><small>${t("fg.today")} ${S.forgedToday}/${lim}</small></div>
            ${items.length < 2 ? `<p>${t("fg.needTwo")} <a href="#pack">${t("btn.openPack")}</a> ${t("fg.getMore")}</p>` : `<div class="card-grid">${items.map((x) => { const c = A.cards.find((k) => k.id === x.id); return `<div data-pick="${x.serial}" style="position:relative;cursor:pointer;${sel.includes(x.serial) ? "outline:3px solid var(--ink);outline-offset:3px;border-radius:8px" : ""}">${cardHTML(c).replace('data-card=', 'data-x=')}<small style="display:block;text-align:center;margin-top:4px">${edLabel(x)}</small></div>`; }).join("")}</div>`}
          </div>
          <div class="grid">
            <div class="panel"><h3>${t("fg.fee")}</h3>
              <label style="display:flex;flex-direction:row;gap:8px;align-items:center"><input type="radio" name="fee" value="coin" checked> 50 Coin</label>
              <label style="display:flex;flex-direction:row;gap:8px;align-items:center"><input type="radio" name="fee" value="gem"> 5 Gem</label>
              <button class="btn primary" id="doForge" style="margin-top:10px;width:100%" ${sel.length === 2 ? "" : "disabled"}>${t("btn.forge")}</button></div>
            <div class="panel"><div class="row"><h3>${t("fg.sealed")}</h3><span class="spacer"></span><b id="sealedCount">${S.sealed}</b></div>
              <div id="sealStage" style="display:grid;place-items:center;min-height:${S.sealed ? 0 : 0}px"></div>
              <button class="btn" id="doReveal" style="width:100%;margin-top:8px" ${S.sealed ? "" : "disabled"}>${t("btn.reveal")}</button></div>
            <div class="panel"><h3>${t("fg.odds")}</h3><table class="odds"><tbody>${odds}</tbody></table>
              <small>${t("fg.oddsNote")}</small></div>
          </div>
        </div></div>`;
    },
    wallet() {
      const app = mode() === "app";
      const skus = [["100 Gem", "$0.99"], ["550 Gem", "$4.99"], ["1,200 Gem", "$9.99"], ["2,600 Gem", "$19.99"]];
      return `<div class="screen"><h1>${t("nav.wallet")}</h1>
        <div class="cols"><div class="panel"><div class="row"><div class="kv"><small>Gem</small><b class="cur gem">${fmt(S.gem)}</b></div><span class="spacer"></span><div class="kv"><small>Coin</small><b class="cur coin">${fmt(S.coin)}</b></div></div>
          <small>${t("wl.noCashout")}</small></div>
        <div class="panel"><h3>${t("wl.topup")}</h3><p>${app ? t("store.payApp") : t("store.payWeb")}</p>
          <div class="grid" style="grid-template-columns:1fr 1fr">${skus.map(([g, p]) => `<button class="btn" data-sku="${g}">${g}<br><small>${p}</small></button>`).join("")}</div>
          <small>${t("wl.priceNote")}</small></div></div>
        <div class="panel"><h3>${t("wl.convert")}</h3>
          <div class="grid" style="grid-template-columns:1fr 1fr">
            <label>Gem → Coin (1 Gem = 9 Coin)<span class="row"><input id="g2c" type="number" min="1" value="10" style="width:100%"><button class="btn" id="doG2C">${t("btn.convert")}</button></span></label>
            <label>Coin → Gem (11 Coin = 1 Gem)<span class="row"><input id="c2g" type="number" min="11" value="110" style="width:100%"><button class="btn" id="doC2G">${t("btn.convert")}</button></span></label>
          </div>
          <small>${t("wl.convertNote", { n: S.gemFromCoinToday })}</small></div>
        <div class="panel"><h3>${t("wl.history")}</h3><div class="list">${S.ledger.slice().reverse().slice(0, 12).map(([a, b]) => `<div class="item"><span>${Array.isArray(a) ? t(a[0], a[1]) : a}</span><b>${b}</b></div>`).join("")}</div></div>
      </div>`;
    },
    account() {
      return `<div class="screen"><h1>${t("nav.account")}</h1>
        <div class="panel"><h3>Keeper #2049</h3><p>keeper2049@example.com · ${t("ac.loginGoogle")}</p>
          <div class="row wrap"><span class="chip">${S.phoneVerified ? t("ac.verified") + " 090****123" : t("ac.unverified")}</span>${S.phoneVerified ? "" : `<button class="btn sm primary" id="verify">${t("btn.verify")}</button>`}</div>
          <small>${t("ac.verifyNote")}</small></div>
        <div class="panel"><h3>${t("ac.devices")}</h3><div class="list">
          <div class="item"><span>${t("ac.dev1")}</span><small>${t("ac.devLimit")}</small></div>
          <div class="item"><span>${t("ac.dev2")}</span><small>${t("ac.webSess")}</small></div></div></div>
        <div class="panel"><h3>${t("ac.fairness")}</h3>
          <p>${t("ac.fairDesc")}</p>
          <div class="list"><div class="item"><span>${t("ac.seedHash")}</span><small style="word-break:break-all;max-width:60%;text-align:right">${S.seedHash}</small></div>
            <div class="item"><span>Client seed</span><small>keeper2049</small></div>
            <div class="item"><span>${t("ac.nonce")}</span><small>${S.nonce}</small></div></div>
          ${S.revealed.length ? `<div class="note" style="margin-top:8px">${t("ac.revealed")}: <code>${S.revealed[S.revealed.length - 1]}</code> — ${t("ac.revealedNote")}</div>` : ""}
          <div class="row wrap" style="margin-top:10px"><button class="btn" id="rotateSeed">${t("btn.rotate")}</button><span class="muted" style="font-size:13px">${t("ac.verifyTool")}</span></div></div>
        <div class="panel web-only"><h3>${t("ac.nft")}</h3><p>${t("ac.nftDesc")}</p>
          <button class="btn" disabled>${t("btn.linkWallet")}</button> <small>${t("ac.nftNote")}</small></div>
        <div class="panel"><h3>${t("ac.settings")}</h3><label style="max-width:260px">${t("ac.language")}<select id="langSel2">${I.LOCALES.map(([k, n]) => `<option value="${k}" ${k === S.locale ? "selected" : ""}>${n}</option>`).join("")}</select></label>
          <p style="margin-top:10px">${t("ac.country")}: VN</p></div>
        <div class="panel"><h3>${t("ac.delete")}</h3>${S.deletion ? `<p>${t("ac.delPending")}</p><button class="btn" id="undoDel">${t("btn.undoDel")}</button>` : `<p>${t("ac.delInfo")}</p><button class="btn danger" id="del">${t("btn.del")}</button>`}</div>
      </div>`;
    },
  };

  /* ---------- Router ---------- */
  function route() {
    const [name, arg] = (location.hash.slice(1) || "home").split("/");
    const fn = screens[name] && name[0] !== "_" ? screens[name] : screens.home;
    $("#skipBtn").textContent = t("btn.skip");
    document.documentElement.lang = S.locale;
    renderNav(name === "card" ? "collection" : name === "pack" ? "store" : name === "wallet" ? "" : name);
    $("#content").innerHTML = fn(arg);
    $("#content").scrollTop = 0;
    bind(name);
  }
  function addCoin(n, why) { S.coin += n; S.ledger.push([why, (n >= 0 ? "+" : "") + fmt(n) + " Coin"]); }
  function addGem(n, why) { S.gem += n; S.ledger.push([why, (n >= 0 ? "+" : "") + fmt(n) + " Gem"]); }
  function bind(name) {
    document.querySelectorAll("[data-go]").forEach((e) => (e.onclick = () => (location.hash = e.dataset.go)));
    document.querySelectorAll("[data-card]").forEach((e) => { if (e.closest(".card-grid")) e.onclick = () => (location.hash = "card/" + e.dataset.card); });
    const on = (id, f) => { const e = document.getElementById(id); if (e) e.onclick = f; };
    on("buyCoin", () => buy("coin"));
    on("buyGem", () => buy("gem"));
    on("openNow", () => startOpening());
    on("checkin", () => {
      if (mode() === "web") return toast(t("err.platform") + ": <code class='err'>PLATFORM_NOT_SUPPORTED</code>", true);
      const vals = [20, 30, 40, 50, 60, 80, 150];
      const v = vals[S.streak % 7];
      S.streak += 1; S.checkedToday = true;
      const bonus = { 14: 200, 30: 1000, 100: 5000 }[S.streak] || 0;
      addCoin(v + bonus, ["lg.checkin", { n: S.streak }]);
      save(); route(); toast(`+${v + bonus} Coin · streak ${S.streak} ngày`);
    });
    on("buyFreeze", () => {
      if (S.freeze >= 2) return toast("Đã giữ tối đa 2 Freeze <code class='err'>FREEZE_LIMIT</code>", true);
      if (S.coin < 200) return toast(t("err.noCoin") + " <code class='err'>INSUFFICIENT_BALANCE</code>", true);
      addCoin(-200, ["lg.freeze"]); S.freeze += 1; save(); route();
    });
    on("watchAd", watchAd);
    const ls2 = document.getElementById("langSel2"); if (ls2) ls2.onchange = (e) => setLocale(e.target.value);
    document.querySelectorAll("[data-pick]").forEach((e) => (e.onclick = () => {
      const sel = screens._forgeSel || [], k = e.dataset.pick, i = sel.indexOf(k);
      if (i >= 0) sel.splice(i, 1); else if (sel.length < 2) sel.push(k); else { sel.shift(); sel.push(k); }
      screens._forgeSel = sel; route();
    }));
    on("doForge", () => {
      const sel = screens._forgeSel || [];
      const lim = S.phoneVerified ? 100 : 5;
      if (sel.length !== 2) return toast("Cần đúng 2 thẻ <code class='err'>FORGE_REQUIRES_TWO_CARDS</code>", true);
      if (S.forgedToday >= lim) return toast("Hết lượt rèn hôm nay <code class='err'>FORGE_DAILY_LIMIT</code>", true);
      const cur = document.querySelector('input[name="fee"]:checked').value;
      if (cur === "coin") { if (S.coin < 50) return toast(t("err.noCoin") + " <code class='err'>INSUFFICIENT_BALANCE</code>", true); addCoin(-50, ["lg.forge"]); }
      else { if (S.gem < 5) return toast(t("err.noGem") + " <code class='err'>INSUFFICIENT_BALANCE</code>", true); addGem(-5, ["lg.forge"]); }
      sel.forEach(burnCard); S.sealed += 1; S.forgedToday += 1; screens._forgeSel = [];
      save(); route(); toast(t("ok.forged"));
    });
    on("doReveal", async () => {
      if (!S.sealed) return;
      const c = A.revealSealed(); S.sealed -= 1; S.nonce += 1;
      const x = addCard(c); S.recent = [c.id].concat(S.recent).slice(0, 10); save();
      const st = $("#sealStage");
      st.innerHTML = cardHTML(c, { flipped: false, w: "140px" }) + `<div style="text-align:center;margin-top:6px"><b>${c.name}</b><br><small>${edLabel(x)} · ${x.serial}</small></div>`;
      const el = st.querySelector(".card"); el.style.setProperty("--flip", reduced() ? "0.01s" : "0.9s");
      await new Promise((r) => setTimeout(r, 60)); el.classList.add("flipped");
      $("#sealedCount").textContent = S.sealed; $("#doReveal").disabled = !S.sealed; $("#doReveal").textContent = t("btn.reveal") + (S.sealed ? ` (${S.sealed})` : "");
      renderNav("forge");
    });
    on("doG2C", () => {
      const n = Math.floor(+$("#g2c").value || 0);
      if (n < 1) return toast("<code class='err'>INVALID_AMOUNT</code>", true);
      if (S.gem < n) return toast(t("err.noGem") + " <code class='err'>INSUFFICIENT_BALANCE</code>", true);
      addGem(-n, ["lg.g2c"]); addCoin(n * 9, ["lg.g2c"]); save(); route(); toast(`Đã đổi ${n} Gem → ${n * 9} Coin`);
    });
    on("doC2G", () => {
      if (!S.phoneVerified) return toast("Cần xác thực SĐT <code class='err'>PHONE_VERIFICATION_REQUIRED</code>", true);
      const coin = Math.floor(+$("#c2g").value || 0), g = Math.floor(coin / 11);
      if (g < 1) return toast("Chưa đủ 11 Coin cho 1 Gem <code class='err'>INVALID_AMOUNT</code>", true);
      if (S.coin < g * 11) return toast(t("err.noCoin") + " <code class='err'>INSUFFICIENT_BALANCE</code>", true);
      if (S.gemFromCoinToday + g > 1000) return toast("Vượt hạn mức 1.000 Gem/ngày <code class='err'>COIN_TO_GEM_DAILY_LIMIT</code>", true);
      addCoin(-g * 11, ["lg.c2g"]); addGem(g, ["lg.c2g"]); S.gemFromCoinToday += g; save(); route(); toast(`Đã đổi ${g * 11} Coin → ${g} Gem`);
    });
    on("rotateSeed", () => {
      S.revealed.push("anima-demo-server-seed-" + String(S.revealed.length + 1).padStart(3, "0"));
      S.seedHash = Array.from({ length: 64 }, () => "0123456789abcdef"[Math.floor(Math.random() * 16)]).join("");
      S.nonce = 1; save(); route(); toast("Đã đổi seed; seed cũ được công bố để bạn tự kiểm tra");
    });
    on("skipCd", () => { S.lastAdAt = 0; save(); route(); });
    on("verify", () => { S.phoneVerified = true; save(); route(); toast("Đã xác thực SĐT (OTP giả lập)"); });
    on("del", () => { S.deletion = true; save(); route(); });
    on("undoDel", () => { S.deletion = false; save(); route(); });
    document.querySelectorAll("[data-sku]").forEach((b) => (b.onclick = () => topup(b.dataset.sku)));
    if (name === "collection") {
      const upd = () => { screens._filter = { q: $("#q").value, el: $("#fel").value, r: $("#fr").value }; const pos = $("#q").selectionStart; route(); const q = $("#q"); q.focus(); q.setSelectionRange(pos, pos); };
      $("#q").oninput = upd; $("#fel").onchange = upd; $("#fr").onchange = upd;
    }
    if (name === "rewards" && Date.now() - S.lastAdAt < 60000) setTimeout(() => location.hash.startsWith("#rewards") && route(), 1000);
  }
  function buy(cur) {
    if (cur === "coin") { if (S.coin < 1000) return toast(t("err.noCoin") + " <code class='err'>INSUFFICIENT_BALANCE</code>", true); addCoin(-1000, ["lg.pack"]); }
    else { if (S.gem < 100) return toast(t("err.noGem") + " <code class='err'>INSUFFICIENT_BALANCE</code>", true); addGem(-100, ["lg.pack"]); }
    S.unopened += 1; save(); renderNav("store"); startOpening();
  }
  function topup(sku) {
    const n = parseInt(sku.replace(/\D/g, ""), 10);
    if (mode() === "app") { toast("Đang xác thực receipt với store…"); setTimeout(() => { addGem(n, ["lg.iap", { n: sku }]); save(); route(); toast(`Đã cộng ${sku}`); }, 1200); }
    else { toast("Chuyển tới cổng thanh toán… Đơn ở trạng thái <b>Chờ xác nhận</b> đến khi server nhận IPN"); setTimeout(() => { addGem(n, ["lg.web", { n: sku }]); save(); route(); toast(`IPN hợp lệ — đã cộng ${sku}`); }, 2200); }
  }
  function watchAd() {
    if (mode() === "web") return toast(t("err.platform") + ": <code class='err'>PLATFORM_NOT_SUPPORTED</code>", true);
    const ad = $("#fakead"); ad.classList.add("on");
    let t = 3; $("#adtimer").textContent = t;
    const iv = setInterval(() => {
      t -= 1; $("#adtimer").textContent = t;
      if (t <= 0) {
        clearInterval(iv); ad.classList.remove("on");
        S.adsToday += 1; S.lastAdAt = Date.now();
        const bonus = S.adsToday === 5 ? 10 : S.adsToday === 10 ? 20 : 0;
        addCoin(8 + bonus, ["lg.ad", { n: S.adsToday }]);
        save(); route(); toast(`SSV hợp lệ · +${8 + bonus} Coin`);
      }
    }, 1000);
  }

  /* ---------- Trình diễn mở pack (Master Document §4) ---------- */
  let skipped = false;
  const wait = (ms) => new Promise((res) => { const s = Date.now(); const tick = () => (skipped || Date.now() - s >= ms ? res() : requestAnimationFrame(tick)); tick(); });
  let liveParticles = 0;
  function burst(x, y, color, n) {
    if (reduced() || skipped) return;
    const layer = $("#particles");
    const o = $("#opening").getBoundingClientRect(); x -= o.left; y -= o.top;
    n = Math.min(n, 200 - liveParticles);
    for (let i = 0; i < n; i++) {
      const p = document.createElement("span");
      p.className = "particle";
      const c = color === "rainbow" ? `hsl(${Math.floor(Math.random() * 6) * 60} 70% 50%)` : color;
      p.style.cssText = `left:${x}px;top:${y}px;background:${c}`;
      layer.appendChild(p); liveParticles++;
      const a = Math.random() * Math.PI * 2, d = 60 + Math.random() * 260;
      p.animate([{ transform: "translate(0,0) scale(1)", opacity: 1 }, { transform: `translate(${Math.cos(a) * d}px,${Math.sin(a) * d}px) scale(.2)`, opacity: 0 }],
        { duration: 600 + Math.random() * 700, easing: "cubic-bezier(.2,.8,.2,1)" }).onfinish = () => { p.remove(); liveParticles--; };
    }
  }
  function flash(color) {
    if (reduced() || skipped) return;
    const f = $("#flash"); f.style.setProperty("--fc", color && color !== "rainbow" ? color : "#fffdf5");
    f.animate([{ opacity: 0.55 }, { opacity: 0.55, offset: 0.2 }, { opacity: 0 }], { duration: 450 });
  }
  function shake() {
    if (reduced() || skipped) return;
    const w = $("#opening"); w.classList.remove("shake"); void w.offsetWidth; w.classList.add("shake");
  }
  const cxO = () => { const r = $("#opening").getBoundingClientRect(); return r.left + r.width / 2; };
  const cyO = () => { const r = $("#opening").getBoundingClientRect(); return r.top + r.height / 2; };
  const colorOf = (key) => { const c = A.RARITIES[A.rarityIndex(key)].color; return c; };

  async function startOpening() {
    if (S.unopened <= 0) return;
    const res = A.openPack(S.pity);            // server quyết định trước
    S.unopened -= 1; S.pity = res.pityAfter;
    res.cards.forEach((c) => addCard(c)); S.nonce += 1;
    S.recent = res.cards.map((c) => c.id).reverse().concat(S.recent).slice(0, 10);
    save();
    skipped = false;
    const O = $("#opening"), row = $("#row"), show = $("#showcase"), pack = $("#bigpack"), cap = $("#caption");
    O.classList.add("on"); $("#summary").style.display = "none"; $("#skipBtn").style.display = ""; show.style.display = "none"; row.innerHTML = ""; $("#dim").style.opacity = 0;
    pack.style.display = "block"; pack.style.animation = ""; pack.style.transform = "";
    pack.getAnimations({ subtree: true }).forEach((an) => an.cancel());
    pack.querySelectorAll(".half").forEach((h) => (h.style.transform = ""));
    $("#light").style.opacity = 0;
    cap.textContent = mode() === "web" ? t("op.web") : "";

    // Giai đoạn 0 — Entry
    if (!reduced()) await pack.animate([{ transform: "translateY(120cqh) rotate(0deg)" }, { transform: "translateY(0) rotate(355deg)" }], { duration: 800, easing: "cubic-bezier(.34,1.56,.64,1)" }).finished.catch(() => {});
    burst(cxO(), cyO(), "#c8a24a", 16);
    // Giai đoạn 1 — Presentation: chờ người chơi xé
    if (!skipped) {
      if (!reduced()) pack.style.animation = "bob 2s ease-in-out infinite";
      cap.textContent = t("op.swipe");
      await new Promise((resolve) => {
        let y0 = null;
        const done = () => { pack.onpointerdown = pack.onpointerup = null; clearInterval(chk); resolve(); };
        pack.onpointerdown = (e) => (y0 = e.clientY);
        pack.onpointerup = (e) => { if (y0 === null || y0 - e.clientY > 30 || Math.abs(y0 - e.clientY) < 8) done(); };
        const chk = setInterval(() => skipped && done(), 100);
      });
    }
    // Giai đoạn 2 — Tearing: ánh sáng theo rarity cao nhất
    pack.style.animation = "";
    cap.textContent = "";
    const lc = colorOf(res.maxRarity) === "rainbow" ? "#be185d" : colorOf(res.maxRarity);
    const light = $("#light"); light.style.setProperty("--lc", lc);
    if (!skipped && !reduced()) {
      await light.animate([{ opacity: 0, transform: "scaleX(.2)" }, { opacity: 1, transform: "scaleX(1)" }], { duration: 700, fill: "forwards" }).finished.catch(() => {});
      const [top, bot] = pack.querySelectorAll(".half");
      top.animate([{ transform: "translateY(0)" }, { transform: "translateY(-60vh) rotate(-12deg)" }], { duration: 700, easing: "ease-in", fill: "forwards" });
      bot.animate([{ transform: "translateY(0)" }, { transform: "translateY(60vh) rotate(8deg)" }], { duration: 700, easing: "ease-in", fill: "forwards" });
      burst(cxO(), cyO(), res.maxRarity === "secret" ? "rainbow" : lc, 40);
      await wait(500);
    }
    pack.style.display = "none"; light.style.opacity = 0;
    row.innerHTML = res.cards.map((c) => cardHTML(c, { flipped: false })).join("");
    const els = [...row.children];
    if (!skipped && !reduced()) els.forEach((e, i) => e.animate([{ transform: "translateY(40vh) scale(.6)", opacity: 0 }, { transform: "none", opacity: 1 }], { duration: 450, delay: i * 90, easing: "cubic-bezier(.34,1.56,.64,1)", fill: "backwards" }));
    await wait(900);

    // Giai đoạn 3 — Reveal: lật từ thấp đến cao
    const fast = $("#fast").checked;
    if (fast && !skipped) { els.forEach((e) => { e.style.setProperty("--flip", "0.5s"); e.classList.add("flipped"); }); await wait(700); }
    for (let i = 0; i < els.length && !fast; i++) {
      if (skipped) break;
      const e = els[i], c = res.cards[i], ri = A.rarityIndex(c.rarity), r = A.RARITIES[ri];
      const rect = e.getBoundingClientRect(), cx = rect.left + rect.width / 2, cy = rect.top + rect.height / 2;
      if (ri >= 3) { $("#dim").style.opacity = 0.6; els.forEach((o) => o !== e && o.classList.add("faded")); }
      if (ri >= 4 && !reduced()) { e.style.animation = "tease .1s linear 5"; cap.textContent = "…"; await wait(600); e.style.animation = ""; }
      e.style.setProperty("--flip", (reduced() ? 0.2 : Math.min(r.flip, ri >= 3 ? 1.5 : r.flip)) + "s");
      e.classList.add("flipped");
      await wait(ri >= 3 ? 800 : r.flip * 500);
      if (ri >= 4) { flash(r.color); shake(); }
      burst(cx, cy, r.color === "rainbow" ? "rainbow" : r.color, [6, 10, 18, 40, 80, 120][ri]);
      await wait(ri >= 3 ? 700 : 250);
      $("#dim").style.opacity = 0; cap.textContent = ""; els.forEach((o) => o.classList.remove("faded"));
    }
    els.forEach((e) => { e.style.setProperty("--flip", "0.01s"); e.classList.add("flipped"); });

    // Giai đoạn 4 — Climax (chỉ khi có Epic+)
    if (res.climax && !skipped) {
      const best = res.cards[res.cards.length - 1], ri = A.rarityIndex(best.rarity);
      row.style.opacity = 0.15; $("#dim").style.opacity = 0.9;
      show.style.display = "grid";
      show.innerHTML = `<div><div style="display:grid;place-items:center">${cardHTML(best).replace('class="card', 'class="card holo')}</div>
        <div class="title" id="typew"></div><div class="rlabel rarity-${best.rarity}">${A.RARITIES[ri].name.toUpperCase()}</div></div>`;
      const sc = show.firstElementChild;
      if (!reduced()) await sc.animate([{ transform: "scale(.4)", opacity: 0 }, { transform: "scale(1)", opacity: 1 }], { duration: fast ? 300 : 900, easing: "ease-in-out" }).finished.catch(() => {});
      const tw = $("#typew");
      for (const ch of best.name) { if (skipped) break; tw.textContent += ch; await wait(fast ? 10 : 45); }
      tw.textContent = best.name;
      await wait(fast ? 300 : 900);
      flash(A.RARITIES[ri].color); shake(); burst(cxO(), cyO(), A.RARITIES[ri].color === "rainbow" ? "rainbow" : A.RARITIES[ri].color, ri >= 4 ? 200 : 120);
      await wait(fast ? 400 : 1200);
      show.style.display = "none"; row.style.opacity = 1; $("#dim").style.opacity = 0;
    }
    // Giai đoạn 5 — Summary
    finish(res);
  }
  function finish(res) {
    const O = $("#opening");
    $("#showcase").style.display = "none"; $("#row").style.opacity = 1; $("#dim").style.opacity = 0; $("#bigpack").style.display = "none";
    const row = $("#row");
    if (!row.children.length) row.innerHTML = res.cards.map((c) => cardHTML(c)).join("");
    [...row.children].forEach((e) => { e.style.setProperty("--flip", "0.01s"); e.classList.add("flipped"); });
    row.lastElementChild.classList.add("best");
    $("#caption").innerHTML = res.pityTriggered ? t("sum.pityHit") : t("sum.pity", { n: S.pity });
    $("#summary").style.display = "flex";
    $("#skipBtn").style.display = "none";
    $("#sumAgain").textContent = S.unopened ? t("sum.again", { n: S.unopened }) : t("sum.buyAgain");
    $("#sumCollection").textContent = t("sum.collection"); $("#sumShare").textContent = t("sum.share"); $("#sumClose").textContent = t("sum.close");
    $("#sumAgain").onclick = () => { if (S.unopened) startOpening(); else { close(); location.hash = "pack"; } };
    $("#sumCollection").onclick = () => { close(); location.hash = "collection"; };
    $("#sumShare").onclick = () => toast("Ảnh kết quả đã sẵn sàng để chia sẻ (giả lập)");
    $("#sumClose").onclick = close;
    function close() { O.classList.remove("on"); route(); }
    skipped = true; // các wait còn treo kết thúc ngay
  }
  $("#skipBtn").onclick = () => { skipped = true; };

  /* ---------- Thanh prototype ---------- */
  document.querySelectorAll("[data-mode]").forEach((b) => (b.onclick = () => {
    document.querySelectorAll("[data-mode]").forEach((x) => x.classList.toggle("on", x === b));
    document.body.className = "mode-" + b.dataset.mode;
    route();
  }));
  $("#newday").onclick = () => {
    if (!S.checkedToday) {
      if (S.freeze > 0) { S.freeze -= 1; toast("Bỏ lỡ 1 ngày — đã dùng 1 Streak Freeze"); }
      else { S.streak = 0; toast("Bỏ lỡ 1 ngày — streak về 0"); }
    }
    S.checkedToday = false; S.adsToday = 0; S.lastAdAt = 0; S.forgedToday = 0; S.gemFromCoinToday = 0; save(); route();
  };
  $("#reset").onclick = () => { S = fresh(); save(); route(); toast("Đã đặt lại dữ liệu demo"); };
  if (/[?&]mode=web/.test(location.search)) document.querySelector('[data-mode="web"]').click();
  const ls = $("#langSel");
  ls.innerHTML = I.LOCALES.map(([k, n]) => `<option value="${k}">${n}</option>`).join("");
  ls.value = S.locale;
  ls.onchange = (e) => setLocale(e.target.value);
  window.addEventListener("hashchange", route);
  route();
})();
</script>
</body>
</html>
