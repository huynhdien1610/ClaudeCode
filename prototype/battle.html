<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ANIMA — Đấu trường</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Lora:wght@700&family=Noto+Sans+SC:wght@400;700&family=Noto+Sans+TC:wght@400;700&display=swap&subset=vietnamese" rel="stylesheet">
<link rel="stylesheet" href="assets/styles.css">
<style>
  /* Thanh điều khiển của prototype (không thuộc sản phẩm) */
  .proto-bar { position: sticky; top: 0; z-index: 50; display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; padding: 8px 16px; background: var(--surface); border-bottom: 1px solid var(--line); font-size: 13px; }
  .proto-bar label { display: flex; flex-direction: row; align-items: center; gap: 6px; font-size: 13px; }
  .proto-bar select { padding: 4px 8px; font-size: 13px; }
  .proto-bar .tag { color: var(--text-3); font-size: 12px; }

  .wrap { max-width: 1180px; margin: 0 auto; padding: 16px; display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 16px; align-items: start; }
  @media (max-width: 900px) { .wrap { grid-template-columns: minmax(0, 1fr); } }

  .board { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; display: grid; gap: 10px; }
  .side { display: grid; gap: 8px; }
  .side.foe { padding-bottom: 10px; border-bottom: 1px dashed var(--line-2); }
  .side.me { padding-top: 10px; border-top: 1px dashed var(--line-2); }
  .keeper { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 8px 10px; border-radius: var(--radius-sm); border: 1px solid var(--line); background: var(--surface-2); }
  .keeper .who { font-weight: 700; min-width: 74px; }
  .keeper .hpbar { flex: 1; min-width: 120px; height: 10px; border-radius: 5px; background: var(--bg-2); overflow: hidden; }
  .keeper .hpbar i { display: block; height: 100%; background: var(--ok); transition: width .3s; }
  .keeper.low .hpbar i { background: var(--danger); }
  .keeper .hp { font-weight: 700; font-variant-numeric: tabular-nums; min-width: 82px; text-align: right; }
  .keeper .meta { color: var(--text-3); font-size: 12px; }
  .keeper.target { outline: 2px solid var(--danger); outline-offset: 2px; cursor: pointer; background: #fbefed; }

  .lane { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)) minmax(0, .8fr); gap: 8px; align-items: stretch; }
  .traps { display: grid; gap: 6px; }
  .slot { min-height: 150px; border: 1px dashed var(--line-2); border-radius: var(--radius-sm); display: grid; place-items: center; color: var(--text-3); font-size: 12px; background: var(--bg); position: relative; }
  .slot.open { border-color: var(--accent); border-style: solid; background: #fbf3ee; cursor: pointer; color: var(--accent); font-weight: 600; }
  .tslot { min-height: 0; height: 100%; min-height: 68px; }
  .tslot .faceDown { width: 100%; height: 100%; border-radius: 6px; background: var(--ink); background-image: repeating-linear-gradient(45deg, rgba(255,255,255,.06) 0 2px, transparent 2px 8px); color: #e9e3d6; display: grid; place-items: center; font-size: 11px; text-align: center; padding: 4px; }

  /* Thẻ trên sân và trên tay */
  .u { --hue: 30; width: 100%; height: 100%; border: 2px solid var(--rc); border-radius: var(--radius-sm); background: #fff; padding: 6px; display: flex; flex-direction: column; gap: 3px; text-align: left; font: inherit; color: inherit; position: relative; cursor: default; }
  button.u { cursor: pointer; }
  .u .top { display: flex; justify-content: space-between; align-items: center; gap: 4px; }
  .u .cost { width: 22px; height: 22px; border-radius: 50%; background: var(--ink); color: #fff; font-size: 12px; font-weight: 700; display: grid; place-items: center; flex: none; }
  .u .glyph { width: 26px; height: 26px; border-radius: 6px; display: grid; place-items: center; background: hsl(var(--hue) 45% 92%); color: hsl(var(--hue) 45% 34%); font-size: 15px; flex: none; }
  .u .nm { font-weight: 700; font-size: 13px; line-height: 1.2; overflow-wrap: anywhere; }
  .u .sub { font-size: 11px; color: var(--text-3); line-height: 1.25; }
  .u .stats { display: flex; gap: 6px; flex-wrap: wrap; font-size: 12px; font-variant-numeric: tabular-nums; margin-top: auto; }
  .u .stats b { font-weight: 700; }
  .u .stats .atk { color: var(--danger); }
  .u .stats .def { color: var(--ink-2); }
  .u .stats .hp { color: var(--ok); }
  .u .badges { display: flex; flex-wrap: wrap; gap: 3px; }
  .u .bd { font-size: 10px; padding: 0 5px; border-radius: 4px; background: var(--surface-2); border: 1px solid var(--line); color: var(--text-2); white-space: nowrap; }
  .u .bd.good { background: #edf5ef; border-color: #b9d8c3; color: var(--ok); }
  .u .bd.bad { background: #fbefed; border-color: #ecc4bf; color: var(--danger); }
  .u.ready { box-shadow: 0 0 0 2px #b9d8c3; }
  .u.sel { box-shadow: 0 0 0 3px var(--accent); }
  .u.target { box-shadow: 0 0 0 3px var(--danger); cursor: pointer; }
  .u.dim { opacity: .55; }
  .u .pred { position: absolute; top: 34%; left: 50%; transform: translateX(-50%); background: var(--danger); color: #fff; font-weight: 700; padding: 2px 8px; border-radius: 6px; font-size: 13px; white-space: nowrap; box-shadow: var(--shadow); }
  .u .pred small { color: #fde2de; font-weight: 500; }
  .u.hit { animation: hit .35s; }
  @keyframes hit { 0%,100% { transform: none; } 30% { transform: translateX(-4px); } 60% { transform: translateX(4px); } }

  .mid { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding: 10px; border-radius: var(--radius-sm); background: var(--bg-2); }
  .pips { display: inline-flex; gap: 4px; }
  .pips i { width: 12px; height: 12px; border-radius: 50%; border: 1.5px solid var(--accent); display: inline-block; }
  .pips i.on { background: var(--accent); }
  .clock { font-variant-numeric: tabular-nums; font-weight: 600; }
  .clock.warn { color: var(--danger); }
  .hint { font-size: 13px; color: var(--text-2); flex-basis: 100%; }

  .hand { display: flex; gap: 8px; overflow-x: auto; padding: 4px 2px 8px; }
  .hand .u { width: 132px; height: auto; min-height: 168px; flex: none; }
  .hand .u.cant { opacity: .5; }
  .hand .u .txt { font-size: 11px; color: var(--text-2); line-height: 1.3; }
  .foe-hand { display: flex; gap: 4px; }
  .foe-hand i { width: 14px; height: 20px; border-radius: 3px; background: var(--ink); display: inline-block; }

  .panel h3 { margin-bottom: 8px; }
  .log { max-height: 360px; overflow-y: auto; font-size: 13px; display: grid; gap: 4px; padding-right: 4px; }
  .log div { color: var(--text-2); line-height: 1.4; }
  .log div.turn { color: var(--text); font-weight: 600; margin-top: 4px; }
  .cycle { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; font-size: 12px; }
  .cycle span.e { padding: 2px 6px; border-radius: 5px; background: hsl(var(--hue) 45% 92%); color: hsl(var(--hue) 45% 30%); font-weight: 600; }
  .side-p { font-size: 13px; color: var(--text-2); margin: 6px 0 0; }

  .ov { position: fixed; inset: 0; background: rgba(246, 244, 239, .86); display: grid; place-items: center; z-index: 80; padding: 16px; }
  .ov .panel { max-width: 640px; max-height: calc(100vh - 32px); overflow-y: auto; width: 100%; display: grid; gap: 10px; box-shadow: var(--shadow); }
  .ov .hand { flex-wrap: wrap; overflow: visible; }
  .ov .hand .u { width: 104px; min-height: 140px; }
  .res-big { font-family: var(--font-display); font-size: 34px; }
  .res-big.win { color: var(--ok); }
  .res-big.lose { color: var(--danger); }
  code.seed { font-size: 12px; overflow-wrap: anywhere; color: var(--text-2); }

  @media (max-width: 560px) {
    .lane { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .traps { grid-column: 1 / -1; grid-template-columns: 1fr 1fr; }
    .slot { min-height: 138px; }
    .u { padding: 4px; }
    .u .nm { font-size: 12px; }
    .u .stats { font-size: 11px; gap: 4px; }
    .hand .u { width: 118px; }
  }
</style>
</head>
<body>
<div class="proto-bar">
  <a href="index.html">← Prototype</a>
  <label>Ngôn ngữ <select id="langSel"></select></label>
  <label>Sàn <select id="arenaSel"></select></label>
  <label><input type="checkbox" id="timerChk" checked> Đồng hồ lượt</label>
  <label>Tốc độ máy <select id="speedSel"><option value="600">Thường</option><option value="120">Nhanh</option></select></label>
  <button class="btn sm" id="newBtn">Trận mới</button>
  <button class="btn sm" id="assistBtn">Máy chơi giúp lượt này</button>
  <span class="tag">Luật rút gọn theo BRD 10.18 → 10.25; chỉ số tạm; trình duyệt đóng vai server.</span>
</div>

<div class="wrap">
  <main class="board" id="board" aria-live="polite"></main>
  <aside class="side-col grid">
    <div class="panel" id="arenaPanel"></div>
    <div class="panel"><h3 id="logTitle"></h3><div class="log" id="log"></div></div>
    <div class="panel" id="rulesPanel"></div>
  </aside>
</div>
<div id="ov"></div>

<script src="assets/data.js"></script>
<script src="assets/i18n.js"></script>

  DEF["Galeword"] = { key: "Galeword", name: "Galeword", el: "Ventara", rarity: "uncommon", type: "echo", cost: 1 };
  DEF["Unspoken Vow"] = { key: "Unspoken Vow", name: "Unspoken Vow", el: "Umbryx", rarity: "rare", type: "seal", cost: 1 };
  /* Công thức Hợp thể (BR-FUS-03/04): ~70% tổng ATK và HP, DEF lấy giá trị cao hơn; chỉ số ghi sẵn trong công thức. */
  const RECIPE = { a: "Nocturne, the Silent Tear", b: "Quietshade", cost: 3, out: "fused" };
  (function () {
    const a = DEF[RECIPE.a], b = DEF[RECIPE.b];
    DEF.fused = { key: "fused", name: "fused", el: "Umbryx", rarity: "legendary", type: "anima", cost: 3, atk: r10((a.atk + b.atk) * 0.7), def: Math.max(a.def, b.def), hp: r10((a.hp + b.hp) * 0.7), arc: "weeper", skill: "fused" };
  })();
  const cname = (key) => (key === "fused" ? t("fusedName") : DEF[key].name.split(",")[0]);

  const PLAYER_DECK = ["Hollowmoth", "Quietshade", "Duskveil", "Nocturne, the Silent Tear", "Cinderpup", "Ashtongue", "Flarekin", "Emberfang, the Ragebound", "Driftkoi", "Rainmemory", "Glimmerkin", "Dawnpetal"]
    .flatMap((k) => [k, k]).concat(["Warmhush", "Seraphel, the Hopebringer", "Dawnsong", "Dawnsong", "Unspoken Vow", "Unspoken Vow"]);
  const AI_DECK = ["Pebbleguard", "Rootbound", "Mossback", "Stoneward, the Unyielding", "Breezeling", "Kitewing", "Zephyrion, the Freewind", "Sparkit", "Jolt Imp", "Static Fox", "Surgeflux, the Revelation", "Tidelet"]
    .flatMap((k) => [k, k]).concat(["Mistwhisper", "Tidemourn, the Deep Sorrow", "Galeword", "Galeword", "Unspoken Vow", "Unspoken Vow"]);

  /* Kiểm tra bộ bài theo BR-DECK (chạy khi khởi động; lỗi thì báo ngay trên console). */
  function validateDeck(list) {
    const errs = [], cnt = {};
    list.forEach((k) => (cnt[k] = (cnt[k] || 0) + 1));
    const anim = list.filter((k) => DEF[k].type === "anima").length;
    if (list.length !== 30) errs.push("DECK_SIZE_INVALID");
    if (anim < 24 || list.length - anim > 6) errs.push("DECK_SUPPORT_LIMIT");
    Object.entries(cnt).forEach(([k, n]) => { const lim = ["legendary", "secret"].includes(DEF[k].rarity) ? 1 : 2; if (n > lim) errs.push("DECK_COPY_LIMIT:" + k); });
    const by = (r) => list.filter((k) => DEF[k].rarity === r).length;
    if (by("epic") > 4 || by("legendary") > 2 || by("secret") > 1) errs.push("DECK_RARITY_LIMIT");
    return errs;
  }
  [PLAYER_DECK, AI_DECK].forEach((d) => { const e = validateDeck(d); if (e.length) console.error("Deck invalid", e); });

  /* RNG tất định từ seed trận (bản thật: HMAC-DRBG theo commit–reveal, SAD 19.1). */
  function mulberry32(a) { return function () { a |= 0; a = (a + 0x6d2b79f5) | 0; let t2 = Math.imul(a ^ (a >>> 15), 1 | a); t2 = (t2 + Math.imul(t2 ^ (t2 >>> 7), 61 | t2)) ^ t2; return ((t2 ^ (t2 >>> 14)) >>> 0) / 4294967296; }; }

  let G, rng, uidSeq = 0, timerId = null, aiBusy = false;
  const timerOn = () => document.getElementById("timerChk").checked;
  const speed = () => +document.getElementById("speedSel").value;

  function newPlayer(id, list) {
    const deck = list.map((key) => ({ uid: ++uidSeq, key }));
    for (let i = deck.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); [deck[i], deck[j]] = [deck[j], deck[i]]; }
    return { id, keeper: KEEPER_HP, deck, hand: [], field: [null, null, null], traps: [null, null], grave: [], n: 0, res: 0, timeouts: 0, chainUsed: false, fused: false, seaUsed: false };
  }
  const who = (p) => (p.id === 0 ? t("you") : t("ai"));
  const foe = (p) => G.P[1 - p.id];
  const L = (k, v) => { G.log.push([k, v || {}]); };

  function newMatch() {
    clearInterval(timerId); aiBusy = false;
    const seed = +(qs.get("seed") || 0) || Math.floor(Math.random() * 1e9);
    rng = mulberry32(seed);
    const pick = document.getElementById("arenaSel").value;
    const arena = pick === "random" ? ORDER.concat(["Nihilum"])[Math.floor(rng() * 8)] : pick;
    G = { seed, hash: fakeHash(seed), arena, P: [newPlayer(0, PLAYER_DECK), newPlayer(1, AI_DECK)], turn: 0, active: 0, phase: "mulligan", log: [], sel: null, hint: null, started: Date.now(), over: null, clock: 20, bank: 30 };
    G.first = rng() < 0.5 ? 0 : 1;
    G.P.forEach((p) => { for (let i = 0; i < 5; i++) draw(p, true); });
    draw(G.P[1 - G.first], true); // người đi sau bốc thêm 1 (BR-BTL-02)
    render();
  }

  function draw(p, silent) {
    const c = p.deck.shift();
    if (!c) { if (!silent) endGame(1 - p.id, "why.deck"); return false; }
    if (p.hand.length >= 10) { p.grave.push(c); L("log.burn", { card: cname(c.key) }); return true; }
    p.hand.push(c); return true;
  }

  /* ----- chỉ số hiệu lực ----- */
  const homeEl = () => G.arena;
  const weakEl = () => (G.arena === "Nihilum" ? null : ORDER[(ix(G.arena) + 2) % 7]);
  const rule = (el) => G.arena === el; // luật riêng của sàn
  function bond(p, u) {
    const arc = DEF[u.key].arc; if (!arc) return [0, 0];
    const n = p.field.filter((x) => x && DEF[x.key].arc === arc).length;
    return n >= 3 ? [200, 400] : n === 2 ? [100, 200] : [0, 0];
  }
  const atkOf = (p, u) => u.atk + bond(p, u)[0] + (u.chainTurn === G.turn ? 300 : 0) + (rule("Pyraxis") ? 200 : 0);
  const defOf = (p, u) => Math.max(0, u.def - (rule("Pyraxis") ? 200 : 0)) * (rule("Terrakin") && p.n <= 3 ? 2 : 1);
  const maxHp = (p, u) => u.hp + bond(p, u)[1];
  const hpOf = (p, u) => maxHp(p, u) - u.dmg;
  function damage(p, u, target, tp) {
    const [c, note] = coef(DEF[u.key].el, DEF[target.key].el);
    return { d: r10(Math.max(100, atkOf(p, u) - defOf(tp, target)) * c / 1000), note };
  }
  const canTargetKeeper = (tp) => tp.field.every((x) => !x);
  const targetable = (tp, x) => x && !x.hidden;

  /* ----- hành động ----- */
  function enter(p, slot, key) {
    const d = DEF[key];
    const u = { uid: ++uidSeq, key, atk: d.atk, def: d.def, hp: d.hp, dmg: 0, sick: d.skill !== "rush", attacked: false, hidden: rule("Umbryx"), chainTurn: -1, gen: null, mod: null };
    if (d.el === homeEl()) { u.atk = r10(u.atk * 1.15); u.hp = r10(u.hp * 1.15); u.mod = "home"; }
    else if (d.el === weakEl()) { u.atk = r10(u.atk * 0.9); u.hp = r10(u.hp * 0.9); u.mod = "weak"; }
    const src = p.field.find((x) => x && generates(DEF[x.key].el, d.el));
    if (src) { u.atk += 200; u.hp += 200; u.gen = DEF[src.key].el; }
    p.field[slot] = u;
    if (src) L("log.gen", { src: cname(src.key), card: cname(key) });
    if (d.skill === "heal") { p.keeper = Math.min(KEEPER_HP, p.keeper + 1000); L("log.skillHeal", { card: cname(key) }); }
    if (d.skill === "wave") { foe(p).field.forEach((x) => x && (x.dmg += 300)); L("log.skillWave", { card: cname(key) }); }
    checkChain(p);
    return u;
  }
  function checkChain(p) {
    if (p.chainUsed) return;
    const els = p.field.filter(Boolean).map((x) => DEF[x.key].el);
    for (let s = 0; s < 7; s++) {
      const want = [ORDER[s], ORDER[(s + 1) % 7], ORDER[(s + 2) % 7]];
      if (want.every((e) => els.includes(e))) {
        want.forEach((e) => { const u = p.field.find((x) => x && DEF[x.key].el === e); u.chainTurn = G.turn; });
        p.chainUsed = true; L("log.chain", { a: want[0], b: want[1], c: want[2] }); return;
      }
    }
  }
  function checkDeaths() {
    let changed = true;
    while (changed) {
      changed = false;
      G.P.forEach((p) => p.field.forEach((u, i) => {
        if (u && hpOf(p, u) <= 0) {
          p.field[i] = null; changed = true; L("log.ko", { card: cname(u.key) });
          if (rule("Aqualis") && !p.seaUsed && u.key !== "fused") { p.seaUsed = true; p.hand.push({ uid: ++uidSeq, key: u.key }); L("log.sea", { card: cname(u.key) }); }
          else p.grave.push({ uid: u.uid, key: u.key });
        }
      }));
    }
    G.P.forEach((p) => { if (p.keeper <= 0 && !G.over) endGame(1 - p.id, "why.keeper"); });
  }

  function playCard(p, handIdx, target) {
    const c = p.hand[handIdx], d = DEF[c.key];
    if (d.cost > p.res) return "hint.noRes";
    if (d.type === "anima") {
      const slot = target != null ? target : p.field.findIndex((x) => !x);
      if (slot < 0 || p.field[slot]) return "hint.full";
      p.res -= d.cost; p.hand.splice(handIdx, 1); L("log.play", { who: who(p), card: cname(c.key) }); enter(p, slot, c.key);
    } else if (d.type === "echo") {
      const u = p.field[target]; if (!u) return "hint.echo";
      const v = DEF[u.key].el === d.el ? 500 : 300;
      p.res -= d.cost; p.hand.splice(handIdx, 1); u.atk += v; u.hp += v; p.grave.push(c);
      L("log.echo", { who: who(p), card: d.name, t: cname(u.key), v: fmt(v) });
    } else {
      const slot = target != null ? target : p.traps.findIndex((x) => !x);
      if (slot < 0 || p.traps[slot]) return "hint.full";
      p.res -= d.cost; p.hand.splice(handIdx, 1); p.traps[slot] = c; L("log.set", { who: who(p) });
    }
    checkDeaths(); return null;
  }

  function attack(p, slot, tslot) {
    const u = p.field[slot], tp = foe(p);
    if (!u) return "hint.noTarget";
    if (u.sick) return "hint.sick";
    if (u.attacked) return "hint.used";
    if (tslot === "K") { if (!canTargetKeeper(tp)) return "hint.noTarget"; }
    else if (!targetable(tp, tp.field[tslot])) return "hint.noTarget";
    u.attacked = true;
    const ti = tp.traps.findIndex((x) => x && DEF[x.key].type === "seal");
    if (ti >= 0) { tp.grave.push(tp.traps[ti]); tp.traps[ti] = null; u.dmg += 400; L("log.trap", { a: cname(u.key) }); flash(p.id, slot); checkDeaths(); return null; }
    if (tslot === "K") { const d = atkOf(p, u); tp.keeper = Math.max(0, tp.keeper - d); L("log.hitK", { a: cname(u.key), d: fmt(d) }); }
    else { const tg = tp.field[tslot]; const { d, note } = damage(p, u, tg, tp); tg.dmg += d; L("log.hit", { a: cname(u.key), b: cname(tg.key), d: fmt(d), x: note ? t(note) : "" }); flash(tp.id, tslot); }
    checkDeaths(); return null;
  }

  function canFuse(p) {
    if (p.fused || p.res < RECIPE.cost) return false;
    return p.field.some((x) => x && x.key === RECIPE.a) && p.field.some((x) => x && x.key === RECIPE.b);
  }
  function fuse(p) {
    if (!canFuse(p)) return "hint.noRes";
    const ia = p.field.findIndex((x) => x && x.key === RECIPE.a), ib = p.field.findIndex((x) => x && x.key === RECIPE.b);
    [ia, ib].forEach((i) => { p.grave.push({ uid: p.field[i].uid, key: p.field[i].key }); p.field[i] = null; });
    p.res -= RECIPE.cost; p.fused = true;
    L("log.fuse", { a: cname(RECIPE.a), b: cname(RECIPE.b), c: cname("fused") });
    enter(p, ia, "fused"); checkDeaths(); return null;
  }

  function startTurn(pid) {
    if (G.over) return;
    G.active = pid; G.turn++; G.sel = null; G.hint = null;
    const p = G.P[pid];
    p.n++; p.res = Math.min(p.n, 6); p.chainUsed = false; p.fused = false;
    p.field.forEach((u) => { if (u) { u.sick = false; u.attacked = false; u.hidden = false; } });
    L("log.turn", { n: p.n, who: who(p), r: p.res });
    const sdFrom = rule("Nihilum") ? 8 : 10;
    if (p.n >= sdFrom) { const d = 500 * (p.n - sdFrom + 1); p.keeper = Math.max(0, p.keeper - d); L("log.sudden", { who: who(p), d: fmt(d) }); }
    if (rule("Voltaris")) {
      const all = []; G.P.forEach((q) => q.field.forEach((u) => u && all.push(u)));
      if (all.length) { const u = all[Math.floor(rng() * all.length)]; u.dmg += 100; L("log.thunder", { card: cname(u.key) }); }
    }
    checkDeaths(); if (G.over) return render();
    if (!draw(p)) return render();
    G.clock = 20;
    render();
    if (pid === 1) runAi();
  }
  function endTurn(byTimeout) {
    if (G.over || G.phase !== "play") return;
    const p = G.P[G.active];
    if (!byTimeout) p.timeouts = 0;
    if (rule("Luminara")) G.P.forEach((q) => {
      const hurt = q.field.filter((u) => u && u.dmg > 0);
      if (!hurt.length) return;
      const u = hurt.reduce((a, b) => (hpOf(q, b) < hpOf(q, a) ? b : a));
      const h = Math.min(200, u.dmg); u.dmg -= h; L("log.heal", { card: cname(u.key), d: fmt(h) });

  }
  function endGame(winner, why) {
    if (G.over) return;
    G.over = { winner, why, ms: Date.now() - G.started }; G.phase = "over"; clearInterval(timerId); aiBusy = false;
  }

  /* ----- AI: luật tham lam, đủ cho PvE luyện tập (Tech Stack 5.2) ----- */
  function aiStep(p) {
    if (canFuse(p)) return fuse(p) === null;
    // 1. Ra Anima đắt nhất trả được, ưu tiên thẻ được "sinh".
    const free = p.field.findIndex((x) => !x);
    if (free >= 0) {
      const opts = p.hand.map((c, i) => ({ c, i, d: DEF[c.key] })).filter((o) => o.d.type === "anima" && o.d.cost <= p.res);
      if (opts.length) {
        opts.sort((a, b) => (b.d.cost - a.d.cost) || (genScore(p, b.d) - genScore(p, a.d)));
        return playCard(p, opts[0].i, free) === null;
      }
    }
    // 2. Úp Ký ức.
    const tfree = p.traps.findIndex((x) => !x);
    const sealIdx = p.hand.findIndex((c) => DEF[c.key].type === "seal");
    if (tfree >= 0 && sealIdx >= 0 && p.res >= 1) return playCard(p, sealIdx, tfree) === null;
    // 3. Tiếng vọng lên Anima mạnh nhất.
    const echoIdx = p.hand.findIndex((c) => DEF[c.key].type === "echo" && DEF[c.key].cost <= p.res);
    const mine = p.field.map((u, i) => ({ u, i })).filter((o) => o.u);
    if (echoIdx >= 0 && mine.length) { mine.sort((a, b) => atkOf(p, b.u) - atkOf(p, a.u)); return playCard(p, echoIdx, mine[0].i) === null; }
    // 4. Tấn công.
    const tp = foe(p);
    const ready = p.field.map((u, i) => ({ u, i })).filter((o) => o.u && !o.u.sick && !o.u.attacked).sort((a, b) => atkOf(p, b.u) - atkOf(p, a.u));
    for (const o of ready) {
      if (canTargetKeeper(tp)) return attack(p, o.i, "K") === null;
      const tg = tp.field.map((x, i) => ({ x, i })).filter((q) => targetable(tp, q.x));
      if (!tg.length) continue;
      tg.forEach((q) => { q.dm = damage(p, o.u, q.x, tp).d; q.kill = q.dm >= hpOf(tp, q.x); q.val = (q.kill ? 10000 + DEF[q.x.key].cost * 1000 : 0) + q.dm; });
      tg.sort((a, b) => b.val - a.val);
      return attack(p, o.i, tg[0].i) === null;
    }
    return false;
  }
  const genScore = (p, d) => (p.field.some((x) => x && generates(DEF[x.key].el, d.el)) ? 1 : 0);
  function runAi() {
    if (aiBusy) return; aiBusy = true;
    const p = G.P[1];
    const tick = () => {
      if (G.over || G.active !== 1) { aiBusy = false; render(); return; }
      const did = aiStep(p); render();
      if (G.over) { aiBusy = false; return; }
      if (did) setTimeout(tick, speed()); else { aiBusy = false; setTimeout(() => endTurn(), speed()); }
    };

  }
  function assist() {

    while (!G.over && aiStep(p) && guard++ < 30) {}
    render(); if (!G.over) endTurn();
  }

  /* ----- đồng hồ lượt (BR-BTL-08) ----- */
  function tickClock() {
    if (!G || G.phase !== "play" || G.over || G.active !== 0 || !timerOn()) return;
    if (G.clock > 0) G.clock--; else if (G.bank > 0) G.bank--;
    if (G.clock <= 0 && G.bank <= 0) {
      const p = G.P[0]; p.timeouts++; L("log.timeout");
      if (p.timeouts >= 3) { endGame(1, "why.timeout"); render(); return; }
      G.bank = 0; endTurn(true); return;
    }
    renderClock();
  }

  /* ---------- Giao diện ---------- */
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  const hue = (el) => A.ELEMENTS[el].hue;
  const glyph = (el) => A.ELEMENTS[el].glyph;

  function unitHtml(p, u, i, side) {
    const d = DEF[u.key], me = side === "me";
    const sel = G.sel && G.sel.kind === "unit" && G.sel.slot === i && me;
    let cls = "u rarity-" + d.rarity, extra = "", act = "";
    const myTurn = G.phase === "play" && G.active === 0 && !G.over;
    if (me && myTurn) {
      const hs = G.sel && G.sel.kind === "hand" && DEF[G.P[0].hand[G.sel.idx].key].type === "echo";
      if (hs) { cls += " target"; act = `data-act="echo-target" data-slot="${i}"`; }
      else { act = `data-act="unit" data-slot="${i}"`; if (!u.sick && !u.attacked) cls += " ready"; }
    }
    if (!me && myTurn && G.sel && G.sel.kind === "unit") {

      if (att && targetable(p, u)) { const { d: dm, note } = damage(G.P[0], att, u, p); cls += " target"; act = `data-act="target" data-slot="${i}"`; extra = `<span class="pred">−${fmt(dm)}${note ? ` <small>${note === "x.strong" ? "×1.25" : note === "x.weak" ? "×0.75" : note === "x.nih" ? "×1.1" : "×1.5"}</small>` : ""}</span>`; }
      else cls += " dim";
    }
    if (sel) cls += " sel";
    const bds = [];
    if (u.key === "fused") bds.push(`<span class="bd good">${t("b.fused")}</span>`);
    if (u.sick) bds.push(`<span class="bd">${t("b.sick")}</span>`); else if (u.attacked) bds.push(`<span class="bd">${t("b.done")}</span>`); else if (me && G.active === 0) bds.push(`<span class="bd good">${t("b.ready")}</span>`);
    if (u.hidden) bds.push(`<span class="bd">${t("b.hidden")}</span>`);
    if (u.gen) bds.push(`<span class="bd good">${t("b.gen")} ${glyph(u.gen)}</span>`);
    if (u.chainTurn === G.turn) bds.push(`<span class="bd good">${t("b.chain")}</span>`);
    if (bond(p, u)[0]) bds.push(`<span class="bd good">${t("b.bond")}</span>`);
    if (u.mod === "home") bds.push(`<span class="bd good">${t("b.home")}</span>`);
    if (u.mod === "weak") bds.push(`<span class="bd bad">${t("b.weak")}</span>`);
    const tag = act ? "button" : "div";
    return `<${tag} class="${cls}" ${act} style="--hue:${hue(d.el)}" data-uid="${u.uid}" aria-label="${esc(cname(u.key))}">
      <div class="top"><span class="glyph">${glyph(d.el)}</span><span class="sub">${d.el}</span><span class="cost">${d.cost}</span></div>
      <div class="nm">${esc(cname(u.key))}</div>
      ${d.arc ? `<div class="sub">${t("arc." + d.arc)}</div>` : ""}
      <div class="badges">${bds.join("")}</div>
      <div class="stats"><span class="atk">ATK <b>${fmt(atkOf(p, u))}</b></span><span class="def">DEF <b>${fmt(defOf(p, u))}</b></span><span class="hp">HP <b>${fmt(Math.max(0, hpOf(p, u)))}</b>/${fmt(maxHp(p, u))}</span></div>
      ${extra}</${tag}>`;
  }
  function cardText(d) {
    if (d.type === "echo") return t("sk.echo");
    if (d.type === "seal") return t("sk.seal");
    return d.skill ? t("sk." + d.skill) : "";
  }
  function handCardHtml(c, i, interactive) {
    const d = DEF[c.key], p = G.P[0];
    const can = d.cost <= p.res;
    let cls = "u rarity-" + d.rarity + (interactive && !can ? " cant" : "") + (G.sel && G.sel.kind === "hand" && G.sel.idx === i ? " sel" : "");
    const tag = interactive ? "button" : "div";
    return `<${tag} class="${cls}" ${interactive ? `data-act="hand" data-idx="${i}"` : ""} style="--hue:${hue(d.el)}" aria-label="${esc(cname(c.key))}">
      <div class="top"><span class="glyph">${glyph(d.el)}</span><span class="sub">${t("type." + d.type)}</span><span class="cost">${d.cost}</span></div>
      <div class="nm">${esc(cname(c.key))}</div>
      <div class="sub">${d.el}${d.arc ? " · " + t("arc." + d.arc) : ""}</div>
      ${cardText(d) ? `<div class="txt">${cardText(d)}</div>` : ""}
      ${d.type === "anima" ? `<div class="stats"><span class="atk">ATK <b>${fmt(d.atk)}</b></span><span class="def">DEF <b>${fmt(d.def)}</b></span><span class="hp">HP <b>${fmt(d.hp)}</b></span></div>` : ""}
    </${tag}>`;
  }
  function keeperHtml(p, side) {
    const myTurn = G.phase === "play" && G.active === 0 && !G.over;
    let cls = "keeper" + (p.keeper <= 2500 ? " low" : ""), act = "";
    if (side === "foe" && myTurn && G.sel && G.sel.kind === "unit" && canTargetKeeper(p)) { cls += " target"; act = `data-act="target" data-slot="K" role="button" tabindex="0"`; }
    const pct = Math.max(0, (p.keeper / KEEPER_HP) * 100);
    const handInfo = side === "foe" ? `<span class="foe-hand" aria-label="${t("hand")} ${p.hand.length}">${p.hand.map(() => "<i></i>").join("")}</span>` : "";
    return `<div class="${cls}" ${act} id="keeper-${side}">
      <span class="who">${who(p)}</span>
      <span class="hpbar"><i style="width:${pct}%"></i></span>
      <span class="hp">${fmt(p.keeper)}</span>
      ${act ? `<span class="chip">${t("direct")}</span>` : ""}
      <span class="meta">${t("deck")} ${p.deck.length} · ${t("hand")} ${p.hand.length} · ${t("grave")} ${p.grave.length}</span>${handInfo}
    </div>`;
  }
  function laneHtml(p, side) {
    const myTurn = G.phase === "play" && G.active === 0 && !G.over;
    const hsel = side === "me" && myTurn && G.sel && G.sel.kind === "hand" ? DEF[G.P[0].hand[G.sel.idx].key].type : null;
    const slots = p.field.map((u, i) => {
      if (u) return `<div class="slot">${unitHtml(p, u, i, side)}</div>`;
      if (hsel === "anima") return `<button class="slot open" data-act="slot" data-slot="${i}">+ ${t("empty")}</button>`;
      return `<div class="slot">${t("empty")}</div>`;
    }).join("");
    const traps = p.traps.map((c, i) => {
      if (c) return `<div class="slot tslot"><div class="faceDown">${side === "me" ? esc(DEF[c.key].name) : t("trapDown")}</div></div>`;
      if (hsel === "seal") return `<button class="slot tslot open" data-act="trap" data-slot="${i}">+ ${t("trap")}</button>`;
      return `<div class="slot tslot">${t("trap")}</div>`;
    }).join("");
    return `<div class="lane">${slots}<div class="traps">${traps}</div></div>`;
  }
  function render() {
    document.documentElement.lang = locale;
    document.title = "ANIMA — " + t("title");
    const me = G.P[0], ai = G.P[1];
    const myTurn = G.phase === "play" && G.active === 0 && !G.over;
    const hint = G.hint ? t(G.hint) : myTurn ? (G.sel ? (G.sel.kind === "unit" ? t("hint.attack") : t({ anima: "hint.anima", echo: "hint.echo", seal: "hint.seal" }[DEF[me.hand[G.sel.idx].key].type])) : t("hint.idle")) : "";
    const p = G.P[G.active];
    document.getElementById("board").innerHTML = `
      <section class="side foe">${keeperHtml(ai, "foe")}${laneHtml(ai, "foe")}</section>
      <div class="mid">
        <b>${t("turn", { n: Math.max(1, p.n) })}</b>
        <span>${G.phase === "play" ? (G.active === 0 ? t("yourTurn") : t("aiTurn")) : ""}</span>
        <span>${t("res")} <span class="pips" aria-label="${p.res}/${Math.min(Math.max(1, p.n), 6)}">${Array.from({ length: Math.min(Math.max(1, p.n), 6) }, (_, i) => `<i class="${i < p.res ? "on" : ""}"></i>`).join("")}</span> ${p.res}</span>
        <span class="clock" id="clock"></span>
        <span class="muted" style="font-size:12px">${t("suddenAt", { n: rule("Nihilum") ? 8 : 10 })}</span>
        <span class="spacer"></span>
        ${myTurn && canFuse(me) ? `<button class="btn" data-act="fuse">${t("fuse", { c: RECIPE.cost })}</button>` : ""}
        <button class="btn primary" data-act="end" ${myTurn ? "" : "disabled"}>${t("endTurn")}</button>
        <button class="btn ghost sm" data-act="surrender" ${G.phase === "play" && !G.over ? "" : "disabled"}>${t("surrender")}</button>
        <div class="hint" id="hint">${hint}</div>
      </div>
      <section class="side me">${laneHtml(me, "me")}${keeperHtml(me, "me")}
        <div class="hand" aria-label="${t("hand")}">${me.hand.map((c, i) => handCardHtml(c, i, myTurn)).join("")}</div>
      </section>`;
    renderClock(); renderSide(); renderOverlay();
  }
  function renderClock() {
    const el = document.getElementById("clock"); if (!el) return;
    if (G.phase !== "play" || G.active !== 0 || G.over || !timerOn()) { el.textContent = ""; return; }
    el.textContent = t("clock", { s: G.clock, b: G.bank });
    el.className = "clock" + (G.clock <= 5 ? " warn" : "");
  }
  function renderSide() {
    const el = G.arena, w = weakEl();
    document.getElementById("arenaPanel").innerHTML = `<h3>${t("s.arena")}: ${glyph(el)} ${t("ar." + el)}</h3>
      <p class="side-p">${el === "Nihilum" ? t("s.modN") : t("s.mod", { el, weak: w })}</p>
      <p class="side-p">${t("rule." + el)}</p>`;
    document.getElementById("logTitle").textContent = t("s.log");
    const log = document.getElementById("log");
    log.innerHTML = G.log.map(([k, v]) => `<div class="${k === "log.turn" ? "turn" : ""}">${esc(t(k, v))}</div>`).join("");
    log.scrollTop = log.scrollHeight;
    document.getElementById("rulesPanel").innerHTML = `<h3>${t("s.rules")}</h3>
      <p class="side-p">${t("s.cycle")}</p>
      <div class="cycle">${ORDER.concat([ORDER[0]]).map((e, i) => `${i ? "→" : ""}<span class="e" style="--hue:${hue(e)}">${glyph(e)} ${e}</span>`).join(" ")}</div>
      <p class="side-p">${t("s.counter")}</p><p class="side-p">${t("s.dmg")}</p><p class="side-p">${t("s.bonus")}</p><p class="side-p">${t("s.deck")}</p>`;
  }
  function renderOverlay() {
    const ov = document.getElementById("ov");
    if (G.phase === "mulligan") {
      ov.innerHTML = `<div class="ov"><div class="panel"><h2>${t("mull.title")}</h2>
        <p>${t("mull.text", { order: t(G.first === 0 ? "order.first" : "order.second") })}</p>
        <div class="hand">${G.P[0].hand.map((c, i) => handCardHtml(c, i, false)).join("")}</div>
        <div class="row"><button class="btn primary" data-act="keep">${t("mull.keep")}</button><button class="btn" data-act="redraw">${t("mull.redraw")}</button></div></div></div>`;
      return;
    }
    if (G.over) {
      const win = G.over.winner === 0, s = Math.round(G.over.ms / 1000);
      ov.innerHTML = `<div class="ov"><div class="panel" id="result">
        <div class="res-big ${win ? "win" : "lose"}">${t(win ? "r.win" : "r.lose")}</div>
        <p>${t(G.over.why)} · ${t("r.stats", { t: G.turn, m: Math.floor(s / 60), s: s % 60 })}</p>
        <code class="seed">${t("r.seed", { seed: G.seed, hash: G.hash.slice(0, 24) + "…" })}</code>
        <p class="muted" style="font-size:13px">${t("r.note")}</p>
        <div class="row"><button class="btn primary" data-act="again">${t("r.again")}</button><a class="btn" href="player.html">${t("r.home")}</a></div></div></div>`;
      return;
    }
    ov.innerHTML = "";
  }
  function flash(pid, slot) {
    setTimeout(() => {
      const p = G.P[pid], u = p.field[slot]; if (!u) return;
      const el = document.querySelector(`[data-uid="${u.uid}"]`); if (el) el.classList.add("hit");
    }, 0);
  }

  /* ----- sự kiện ----- */
  document.addEventListener("click", (e) => {
    const b = e.target.closest("[data-act]"); if (!b || !G) return;
    const act = b.dataset.act, me = G.P[0];
    if (act === "keep" || act === "redraw") {
      if (act === "redraw") { me.deck.push(...me.hand.splice(0)); for (let i = me.deck.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); [me.deck[i], me.deck[j]] = [me.deck[j], me.deck[i]]; } for (let i = 0; i < (G.first === 0 ? 5 : 6); i++) draw(me, true); L("log.mull", { who: t("you") }); }
      G.phase = "play"; L("log.start", { arena: t("ar." + G.arena), who: who(G.P[G.first]) });
      clearInterval(timerId); timerId = setInterval(tickClock, 1000);
      startTurn(G.first); return;
    }
    if (act === "again") { newMatch(); return; }
    if (act === "surrender") { endGame(1, "why.surrender"); render(); return; }
    if (G.phase !== "play" || G.active !== 0 || G.over) return;
    G.hint = null;
    if (act === "end") { endTurn(); return; }
    if (act === "fuse") { G.hint = fuse(me); G.sel = null; render(); return; }
    if (act === "hand") {
      const i = +b.dataset.idx, d = DEF[me.hand[i].key];
      if (G.sel && G.sel.kind === "hand" && G.sel.idx === i) { G.sel = null; render(); return; }
      if (d.cost > me.res) { G.sel = null; G.hint = "hint.noRes"; render(); return; }
      if (d.type === "anima" && me.field.every(Boolean)) { G.hint = "hint.full"; render(); return; }
      if (d.type === "seal" && me.traps.every(Boolean)) { G.hint = "hint.full"; render(); return; }
      if (d.type === "echo" && me.field.every((x) => !x)) { G.hint = "hint.noTarget"; render(); return; }
      G.sel = { kind: "hand", idx: i }; render(); return;
    }
    if (act === "slot" || act === "trap" || act === "echo-target") {
      if (!G.sel || G.sel.kind !== "hand") return;
      G.hint = playCard(me, G.sel.idx, +b.dataset.slot); G.sel = null; render(); return;
    }
    if (act === "unit") {
      const i = +b.dataset.slot, u = me.field[i];
      if (G.sel && G.sel.kind === "unit" && G.sel.slot === i) { G.sel = null; render(); return; }
      if (u.sick) { G.sel = null; G.hint = "hint.sick"; render(); return; }
      if (u.attacked) { G.sel = null; G.hint = "hint.used"; render(); return; }
      const tp = G.P[1];
      if (!canTargetKeeper(tp) && !tp.field.some((x) => targetable(tp, x))) { G.hint = "hint.noTarget"; render(); return; }
      G.sel = { kind: "unit", slot: i }; render(); return;
    }
    if (act === "target") {
      if (!G.sel || G.sel.kind !== "unit") return;
      const s = b.dataset.slot;
      G.hint = attack(me, G.sel.slot, s === "K" ? "K" : +s); G.sel = null; render(); return;
    }
  });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && G && G.sel) { G.sel = null; render(); } });

  /* ----- thanh prototype ----- */
  const ls = document.getElementById("langSel");
  ls.innerHTML = I.LOCALES.map(([k, n]) => `<option value="${k}">${n}</option>`).join("");
  ls.value = locale;
  ls.addEventListener("change", () => {
    locale = ls.value;
    try { const s = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; s.locale = locale; localStorage.setItem(KEY, JSON.stringify(s)); } catch (e) { /* bỏ qua */ }
    fillArenaSel(); render();
  });
  function fillArenaSel() {
    const as = document.getElementById("arenaSel"), cur = as.value || qs.get("arena") || "random";
    as.innerHTML = `<option value="random">${t("s.random")}</option>` + ORDER.concat(["Nihilum"]).map((e) => `<option value="${e}">${glyph(e)} ${t("ar." + e)}</option>`).join("");
    as.value = cur;
  }
  fillArenaSel();
  if (qs.get("timer") === "0") document.getElementById("timerChk").checked = false;
  if (qs.get("speed") === "fast") document.getElementById("speedSel").value = "120";
  document.getElementById("timerChk").addEventListener("change", renderClock);
  document.getElementById("newBtn").addEventListener("click", newMatch);
  document.getElementById("assistBtn").addEventListener("click", assist);

  window.ANIMA_BATTLE = { get state() { return G; }, DEF, coef, damage: (a, b, ad, bd) => r10(Math.max(100, a - b) * coef(ad, bd)[0] / 1000), validateDeck, PLAYER_DECK, AI_DECK, assist, render: () => render() };
  newMatch();
})();
</script>
</body>
</html>
