<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ANIMA — Prototype admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Lora:wght@700&display=swap&subset=vietnamese" rel="stylesheet">
<link rel="stylesheet" href="assets/styles.css">
<style>
  body { background: var(--bg); }
  .layout { display: grid; grid-template-columns: 240px 1fr; min-height: 100vh; }
  .side { background: var(--surface); border-right: 1px solid var(--line); padding: 16px 12px; display: flex; flex-direction: column; gap: 4px; }
  .side .logo { font-family: var(--font-display); font-size: 18px; font-weight: 700; letter-spacing: 3px; padding: 4px 10px 14px; color: var(--ink); }
  .side .logo small { display: block; font-family: var(--font); letter-spacing: 0; font-size: 12px; font-weight: 500; color: var(--text-3); }
  .side a { text-decoration: none; color: var(--text-2); padding: 9px 12px; border-radius: 10px; font-weight: 600; font-size: 14px; }
  .side a.on { background: var(--surface-2); color: var(--text); box-shadow: inset 3px 0 0 var(--accent); }
  .side a.locked { opacity: .45; }
  .main { padding: 0; min-width: 0; }
  .top { display: flex; gap: 10px; align-items: center; padding: 12px 24px; border-bottom: 1px solid var(--line); flex-wrap: wrap; background: var(--surface); }
  .page { padding: 20px 24px 40px; display: grid; gap: 16px; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
  .kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; }
  .kpi b { font-size: 24px; display: block; }
  .bar { height: 10px; border-radius: 999px; background: var(--surface-2); position: relative; overflow: visible; }
  .bar > i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 999px; }
  .bar .mark { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--text-3); }
  .status { font-size: 12px; font-weight: 700; padding: 2px 9px; border-radius: 999px; border: 1px solid var(--line); }
  .status.Verified, .status.active, .status.approved { color: var(--ok); border-color: rgba(52,211,153,.4); }
  .status.Restricted, .status.pending { color: var(--warn); border-color: rgba(251,191,36,.4); }
  .status.Banned, .status.rejected { color: var(--danger); border-color: rgba(248,113,113,.4); }
  .status.Unverified, .status.draft { color: var(--text-2); }
  .modal { position: fixed; inset: 0; background: rgba(28,26,23,.35); display: none; place-items: center; z-index: 60; padding: 16px; }
  .modal.on { display: grid; }
  .modal .panel { width: min(480px, 100%); display: grid; gap: 12px; }
  .diff-up { color: var(--ok); } .diff-down { color: var(--danger); }
  .forbidden { border: 1px dashed var(--danger); border-radius: var(--radius); padding: 18px; color: var(--text-2); }
  @media (max-width: 820px) {
    .layout { grid-template-columns: 1fr; }
    .side { flex-direction: row; overflow-x: auto; border-right: 0; border-bottom: 1px solid var(--line); }
    .side .logo { display: none; }
    .side a { white-space: nowrap; }
    .page, .top { padding-left: 16px; padding-right: 16px; }
    .table-wrap { overflow-x: auto; }
  }
</style>
</head>
<body>
<div class="layout">
  <aside class="side" id="side"></aside>
  <div class="main">
    <div class="top">
      <a href="index.html" class="btn sm ghost">← Prototype</a>
      <span class="spacer"></span>
      <label style="display:flex;flex-direction:row;align-items:center;gap:8px">Đăng nhập với vai trò
        <select id="role"></select></label>
    </div>
    <div class="page" id="page"></div>
  </div>
</div>
<div class="modal" id="modal"><div class="panel" id="modalBody"></div></div>

<script src="assets/data.js"></script>
<script>
(() => {
  const A = window.ANIMA;
  const $ = (s) => document.querySelector(s);
  const USERS = {
    cs: { name: "Lan", role: "CS Agent" },
    content: { name: "Quân", role: "Content Manager" },
    economy: { name: "Hà", role: "Economy Manager" },
    economy2: { name: "Vy", role: "Economy Manager" },
    fraud: { name: "Phong", role: "Fraud Analyst" },
    finance: { name: "Trang", role: "Finance Viewer" },
    super: { name: "Sơn", role: "Super Admin" },
  };
  /* Ma trận quyền theo BRD mục 12.2 — backend là nơi thực thi, UI chỉ phản ánh. */
  const CAN = {
    viewAccounts: ["cs", "fraud", "super"],
    revealPII: ["fraud", "super"],
    restrict: ["fraud", "super"],
    unban: ["super"],
    editCards: ["content"],
    oddsMake: ["economy", "economy2"],
    oddsApprove: ["super"],
    econMake: ["economy", "economy2"],
    econApprove: ["economy", "economy2", "super"],
    compMake: ["cs"],
    compApprove: ["fraud"],
    dashboard: ["economy", "economy2", "finance", "super"],
    audit: ["fraud", "super"],
  };
  let me = "economy";
  const can = (p) => CAN[p].includes(me);
  const who = () => `${USERS[me].name} (${USERS[me].role})`;
  const now = () => new Date().toLocaleString("vi-VN");
  const audit = [
    { t: "2026-10-05 21:14", actor: "Phong (Fraud Analyst)", action: "RESTRICT", target: "acc_3fa1", detail: "Verified → Restricted · lý do: nghi farm ads" },
    { t: "2026-10-05 18:02", actor: "Hà (Economy Manager)", action: "ODDS_DRAFT_CREATED", target: "Awakening Standard v2", detail: "Legendary 4% → 4.5%" },
  ];
  function log(action, target, detail) { audit.unshift({ t: now(), actor: who(), action, target, detail }); }
  function toast(msg, err) { const t = document.createElement("div"); t.className = "toast" + (err ? " err" : ""); t.innerHTML = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 2800); }
  const forbid = (p) => { if (can(p)) return false; toast(`Server từ chối: <code class="err">FORBIDDEN</code> — đã ghi audit`, true); log("FORBIDDEN", p, "Thử thao tác ngoài quyền"); return true; };

  const accounts = [
    { id: "acc_9c21", name: "Keeper #2049", email: "keeper2049@example.com", phone: "+84901234123", status: "Verified", reason: "", gem: 120, coin: 1300, platform: "iOS + Web" },
    { id: "acc_3fa1", name: "Keeper #1188", email: "minh.t@example.com", phone: "+84987654321", status: "Restricted", reason: "FRAUD", gem: 0, coin: 4210, platform: "Android" },
    { id: "acc_77b0", name: "Keeper #3302", email: "linh.n@example.com", phone: "+84912000456", status: "Restricted", reason: "NEGATIVE_GEM", gem: -400, coin: 80, platform: "iOS" },
    { id: "acc_12de", name: "Keeper #0451", email: "huy.p@example.com", phone: "", status: "Unverified", reason: "", gem: 0, coin: 300, platform: "Web" },
    { id: "acc_5e5e", name: "Keeper #9001", email: "bot91@example.com", phone: "+84933111222", status: "Banned", reason: "bot", gem: 0, coin: 0, platform: "Android" },
  ];
  const maskPhone = (p) => (p ? "0" + p.slice(3, 5) + "****" + p.slice(-3) : "—");
  const maskEmail = (e) => e[0] + "***@" + e.split("@")[1];
  const revealed = new Set();

  const active = { version: "v1", odds: { common: 45, uncommon: 25, rare: 18, epic: 7, legendary: 4, secret: 1 }, from: "2026-09-01 00:00", by: "Hà", approver: "Sơn" };
  const versions = [
    { version: "v2", odds: { common: 44.5, uncommon: 25, rare: 18, epic: 7, legendary: 4.5, secret: 1 }, from: "2026-11-01 00:00", by: "economy", status: "pending" },
  ];
  const econ = [
    ["Thưởng rewarded video", "8 Coin"], ["Thưởng rewarded playable", "15 Coin"], ["Bonus lượt ad thứ 5 / 10", "+10 / +20 Coin"],
    ["Giới hạn ads / cooldown", "10 lượt/ngày · 60 giây"], ["Điểm danh ngày 1 → 7", "20, 30, 40, 50, 60, 80, 150"],
    ["Mốc streak 14 / 30 / 100", "+200 / +1,000 / +5,000"], ["Phí chợ (R2)", "5% · đấu giá 10%"], ["Trần chi phí thưởng ads", "50% doanh thu ads (cảnh báo 45%)"],
  ];
  const comps = [{ id: "CMP-12", acc: "acc_9c21", amount: 500, ticket: "T-90", by: "Lan (CS Agent)", status: "pending" }];
  const cardStats = A.cards.map((c, i) => ({ ...c, instances: Math.round(2000 / (A.rarityIndex(c.rarity) + 1) ** 2 + i * 7), active: true }));

  const MENU = [
    ["dashboard", "Tổng quan", "dashboard"], ["accounts", "Tài khoản", "viewAccounts"], ["cards", "Thẻ & Set", "editCards"],
    ["odds", "Pack & Tỷ lệ", null], ["economy", "Tham số kinh tế", null], ["comp", "Bồi thường", null], ["audit", "Audit log", "audit"],
  ];
  function side(cur) {
    $("#side").innerHTML = `<div class="logo">ANIMA<small>Quản trị vận hành</small></div>` + MENU.map(([k, l, p]) => `<a href="#${k}" class="${k === cur ? "on" : ""} ${p && !can(p) ? "locked" : ""}">${l}${p && !can(p) ? "  · khóa" : ""}</a>`).join("");
  }
  const denied = (p, label) => `<div class="forbidden"><h3>Không có quyền</h3><p>Vai trò <b>${USERS[me].role}</b> không được ${label}. Server trả <code class="err">FORBIDDEN</code> nếu gọi thẳng API.</p></div>`;
  const sum = (o) => Math.round(Object.values(o).reduce((a, b) => a + +b, 0) * 100) / 100;

  const pages = {
    dashboard() {
      if (!can("dashboard")) return denied("dashboard", "xem dashboard doanh thu");
      const cost = 38;
      return `<h1>Tổng quan</h1><p>Dữ liệu giả lập · cập nhật 5 phút trước</p>
        <div class="kpis">
          <div class="kpi"><small>DAU</small><b>8,412</b><small class="diff-up">+6.1% so với tuần trước</small></div>
          <div class="kpi"><small>Retention D1 / D7 / D30</small><b>41% / 19% / 9%</b><small>Mục tiêu 40 / 20 / 10</small></div>
          <div class="kpi"><small>% DAU xem ≥ 1 ad</small><b>63%</b><small>Mục tiêu 60%</small></div>
          <div class="kpi"><small>Người sưu tầm tích cực / tuần</small><b>3,905</b><small>North Star (PRD 4.1)</small></div>
          <div class="kpi"><small>Doanh thu tháng</small><b>$6,240</b><small>IAP 71% · Web 12% · Ads 17%</small></div>
        </div>
        <div class="panel"><div class="row"><h3>Chi phí thưởng ads / doanh thu ads (tháng này)</h3><span class="spacer"></span><b>${cost}%</b></div>
          <div class="bar"><i style="width:${cost}%;background:var(--ok)"></i><span class="mark" style="left:45%"></span><span class="mark" style="left:50%;background:var(--danger)"></span></div>
          <small>Vạch 45%: cảnh báo Economy Manager · vạch 50%: tự chuyển sang bảng thưởng "giảm" (BR-ECO-04)</small></div>
        <div class="panel"><h3>Pack đã mở hôm nay theo rarity cao nhất</h3>
          <table><tbody>${[["common", 1210], ["uncommon", 2875], ["rare", 3020], ["epic", 1544], ["legendary", 862], ["secret", 97]].map(([k, n]) => `<tr class="rarity-${k}"><td style="width:140px"><span class="rarity-text">${A.RARITIES[A.rarityIndex(k)].name}</span></td><td><div class="bar"><i style="width:${n / 32}%;background:var(--rc)"></i></div></td><td style="width:70px;text-align:right">${n.toLocaleString("vi-VN")}</td></tr>`).join("")}</tbody></table>
          <small>Pity kích hoạt hôm nay: 3 lần · Đối soát IAP và cổng web hôm qua: lệch 0</small></div>`;
    },
    accounts() {
      if (!can("viewAccounts")) return denied("viewAccounts", "tra cứu tài khoản");
      return `<h1>Tài khoản</h1><div class="row wrap"><input placeholder="Tìm theo ID, tên, email đã che" style="flex:1;min-width:200px"><select><option>Mọi trạng thái</option><option>Verified</option><option>Restricted</option><option>Banned</option></select></div>
        <div class="panel table-wrap"><table><thead><tr><th>Tài khoản</th><th>Liên hệ</th><th>Trạng thái</th><th>Số dư</th><th>Nền tảng</th><th></th></tr></thead><tbody>
        ${accounts.map((a) => `<tr><td><b>${a.name}</b><br><small>${a.id}</small></td>
          <td>${revealed.has(a.id) ? a.email + "<br>" + (a.phone || "—") : maskEmail(a.email) + "<br>" + maskPhone(a.phone)}
            ${can("revealPII") && !revealed.has(a.id) ? `<br><button class="btn sm ghost" data-reveal="${a.id}">Xem đầy đủ</button>` : ""}</td>
          <td><span class="status ${a.status}">${a.status}</span>${a.reason ? `<br><small>${a.reason}</small>` : ""}</td>
          <td><span class="cur gem">${a.gem}</span> Gem<br><span class="cur coin">${a.coin.toLocaleString("vi-VN")}</span> Coin</td><td>${a.platform}</td>
          <td class="row wrap">${a.status === "Banned" ? `<button class="btn sm" data-unban="${a.id}">Gỡ ban</button>` : `<button class="btn sm" data-restrict="${a.id}">Hạn chế</button><button class="btn sm danger" data-ban="${a.id}">Ban</button>`}</td></tr>`).join("")}
        </tbody></table></div>
        <small>Mỗi lần xem PII đầy đủ được ghi audit. Restricted vì NEGATIVE_GEM tự gỡ khi người chơi nạp bù.</small>`;
    },
    cards() {
      if (!can("editCards")) return denied("editCards", "sửa thẻ và story");
      return `<div class="row"><h1>Thẻ & Set</h1><span class="spacer"></span><button class="btn primary" id="newCard">+ Thêm thẻ</button></div>
        <div class="row wrap"><span class="chip">Set Awakening · ${A.cards.length} thẻ mẫu / 100 dự kiến</span><span class="chip">8 hệ cảm xúc</span></div>
        <div class="panel table-wrap"><table><thead><tr><th>Thẻ</th><th>Hệ</th><th>Rarity</th><th>Bản đã phát hành</th><th>Trạng thái</th><th></th></tr></thead><tbody>
        ${cardStats.map((c) => `<tr class="rarity-${c.rarity}"><td><b>${c.name}</b><br><small>#${c.id}</small></td><td>${A.ELEMENTS[c.element].glyph} ${c.element}</td>
          <td><span class="rarity-text">${A.RARITIES[A.rarityIndex(c.rarity)].name}</span></td><td>${c.instances.toLocaleString("vi-VN")}</td>
          <td><span class="status ${c.active ? "active" : "draft"}">${c.active ? "Đang phát hành" : "Ngừng phát hành"}</span></td>
          <td class="row wrap"><button class="btn sm" data-story="${c.id}">Story</button>${c.active ? `<button class="btn sm" data-retire="${c.id}">Ngừng phát hành</button>` : ""}<button class="btn sm danger" data-delcard="${c.id}">Xóa</button></td></tr>`).join("")}
        </tbody></table></div>`;
    },
    odds() {
      const v = versions[versions.length - 1];
      const keys = Object.keys(active.odds);
      const draftRows = keys.map((k) => {
        const d = Math.round((v.odds[k] - active.odds[k]) * 100) / 100;
        return `<tr class="rarity-${k}"><td><span class="rarity-text">${A.RARITIES[A.rarityIndex(k)].name}</span></td><td>${active.odds[k]}%</td>
          <td><input type="number" step="0.01" min="0" data-odd="${k}" value="${v.odds[k]}" style="width:100px" ${v.status !== "draft" || !can("oddsMake") ? "disabled" : ""}></td>
          <td class="${d > 0 ? "diff-up" : d < 0 ? "diff-down" : ""}">${d > 0 ? "+" : ""}${d || ""}</td></tr>`;
      }).join("");
      const s = sum(v.odds);
      const creator = USERS[v.by];
      return `<h1>Pack & Tỷ lệ — Awakening Standard</h1>
        <div class="panel"><div class="row"><h3>Version đang hiệu lực: ${active.version}</h3><span class="spacer"></span><span class="status active">active</span></div>
          <p>Hiệu lực từ ${active.from} · tạo bởi ${active.by}, duyệt bởi ${active.approver}. Không sửa được version đang hiệu lực (BR-ADM-03).</p></div>
        <div class="panel"><div class="row wrap"><h3>Version ${v.version}</h3><span class="status ${v.status}">${{ draft: "Bản nháp", pending: "Chờ duyệt", approved: "Đã duyệt", rejected: "Bị từ chối" }[v.status]}</span><span class="spacer"></span>
          <small>Người tạo: ${creator.name} (${creator.role})</small></div>
          <div class="table-wrap"><table><thead><tr><th>Rarity</th><th>${active.version}</th><th>${v.version}</th><th>Chênh lệch</th></tr></thead><tbody>${draftRows}</tbody>
          <tfoot><tr><th>Tổng</th><th>100%</th><th id="sum" style="color:${s === 100 ? "var(--ok)" : "var(--danger)"}">${s}%</th><th></th></tr></tfoot></table></div>
          <div class="row wrap" style="margin-top:12px"><label>Hiệu lực từ<input type="datetime-local" id="effFrom" value="2026-11-01T00:00" ${v.status !== "draft" ? "disabled" : ""}></label></div>
          <div class="row wrap" style="margin-top:12px">
            ${v.status === "draft" ? `<button class="btn primary" id="submitOdds">Gửi duyệt</button>` : ""}
            ${v.status === "pending" ? `<button class="btn primary" id="approveOdds">Duyệt</button><button class="btn danger" id="rejectOdds">Từ chối</button>` : ""}
            ${v.status !== "draft" && v.status !== "pending" ? `<button class="btn" id="newDraft">Tạo bản nháp mới</button>` : ""}
          </div>
          <small>Maker-checker: người tạo không được tự duyệt; tổng tỷ lệ phải đúng 100.00% (BR-ADM-02).</small></div>`;
    },
    economy() {
      return `<h1>Tham số kinh tế</h1><p>Mọi thay đổi tạo version mới có thời điểm hiệu lực trong tương lai; bản ghi cũ giữ giá trị đã chốt (BR-ECO-03).</p>
        <div class="panel table-wrap"><table><thead><tr><th>Tham số</th><th>Giá trị hiện hành</th><th></th></tr></thead><tbody>
        ${econ.map(([k, v], i) => `<tr><td>${k}</td><td><b>${v}</b></td><td><button class="btn sm" data-econ="${i}">Tạo version mới</button></td></tr>`).join("")}</tbody></table></div>`;
    },
    comp() {
      return `<div class="row"><h1>Bồi thường</h1><span class="spacer"></span><button class="btn primary" id="newComp">+ Tạo yêu cầu</button></div>
        <p>Chỉ bồi thường bằng Coin hoặc thẻ; không cộng Gem trực tiếp (BR-ADM-04). CS Agent tạo, Fraud Analyst duyệt.</p>
        <div class="panel table-wrap"><table><thead><tr><th>Mã</th><th>Tài khoản</th><th>Số Coin</th><th>Ticket</th><th>Người tạo</th><th>Trạng thái</th><th></th></tr></thead><tbody>
        ${comps.map((c) => `<tr><td>${c.id}</td><td>${c.acc}</td><td>${c.amount}</td><td>${c.ticket}</td><td>${c.by}</td><td><span class="status ${c.status}">${c.status === "pending" ? "Chờ duyệt" : "Đã duyệt"}</span></td>
          <td>${c.status === "pending" ? `<button class="btn sm" data-approvecomp="${c.id}">Duyệt</button>` : ""}</td></tr>`).join("")}</tbody></table></div>
        <div class="panel"><div class="row"><button class="btn danger" id="grantGem">Cộng 1,000 Gem cho tài khoản (thử)</button><small>Nút này để minh họa: server luôn từ chối.</small></div></div>`;
    },
    audit() {
      if (!can("audit")) return denied("audit", "xem audit log");
      return `<h1>Audit log</h1><p>Chỉ thêm, không sửa, không xóa (BR-ADM-01).</p>
        <div class="panel table-wrap"><table><thead><tr><th>Thời gian</th><th>Người thực hiện</th><th>Hành động</th><th>Đối tượng</th><th>Chi tiết</th></tr></thead><tbody>
        ${audit.map((a) => `<tr><td>${a.t}</td><td>${a.actor}</td><td><code>${a.action}</code></td><td>${a.target}</td><td>${a.detail}</td></tr>`).join("")}</tbody></table></div>`;
    },
  };

  function modal(html, onOk) {
    $("#modalBody").innerHTML = html + `<div class="row"><span class="spacer"></span><button class="btn ghost" id="mCancel">Hủy</button><button class="btn primary" id="mOk">Xác nhận</button></div>`;
    $("#modal").classList.add("on");
    $("#mCancel").onclick = () => $("#modal").classList.remove("on");
    $("#mOk").onclick = () => { if (onOk() !== false) $("#modal").classList.remove("on"); };
  }
  function route() {
    const p = location.hash.slice(1) || "dashboard";
    side(p);
    $("#page").innerHTML = (pages[p] || pages.dashboard)();
    bind();
  }
  function bind() {
    const all = (sel, f) => document.querySelectorAll(sel).forEach((e) => (e.onclick = () => f(e)));
    const acc = (id) => accounts.find((a) => a.id === id);
    all("[data-reveal]", (e) => { if (forbid("revealPII")) return; revealed.add(e.dataset.reveal); log("PII_VIEWED", e.dataset.reveal, "Xem email/SĐT đầy đủ"); route(); });
    const statusChange = (e, to, perm) => {
      if (forbid(perm)) return;
      const a = acc(e.dataset[Object.keys(e.dataset)[0]]);
      modal(`<h3>${to === "Banned" ? "Ban" : to === "Verified" ? "Gỡ ban" : "Hạn chế"} ${a.name}</h3><label>Lý do (bắt buộc)<textarea id="why" rows="3"></textarea></label>`, () => {
        const why = $("#why").value.trim();
        if (!why) { toast(`Thiếu lý do <code class="err">REASON_REQUIRED</code>`, true); return false; }
        log(to === "Banned" ? "BAN" : to === "Verified" ? "UNBAN" : "RESTRICT", a.id, `${a.status} → ${to} · lý do: ${why}`);
        a.status = to; a.reason = to === "Restricted" ? "FRAUD" : to === "Banned" ? why : ""; route(); toast("Đã cập nhật và ghi audit");
      });
    };
    all("[data-restrict]", (e) => statusChange(e, "Restricted", "restrict"));
    all("[data-ban]", (e) => statusChange(e, "Banned", "restrict"));
    all("[data-unban]", (e) => statusChange(e, "Verified", "unban"));
    all("[data-delcard]", (e) => { if (forbid("editCards")) return; const c = cardStats.find((x) => x.id === +e.dataset.delcard); toast(`Không xóa được: đã có ${c.instances.toLocaleString("vi-VN")} bản <code class="err">CARD_HAS_INSTANCES</code>`, true); });
    all("[data-retire]", (e) => { if (forbid("editCards")) return; const c = cardStats.find((x) => x.id === +e.dataset.retire); c.active = false; log("CARD_RETIRED", c.name, "Không xuất hiện trong version tỷ lệ mới"); route(); });
    all("[data-story]", (e) => { const c = A.cards.find((x) => x.id === +e.dataset.story); modal(`<h3>Story — ${c.name}</h3><label>Tiếng Việt<textarea rows="4">${c.story}</textarea></label><label>English<textarea rows="3" placeholder="Bản dịch tiếng Anh"></textarea></label>`, () => { if (forbid("editCards")) return false; log("STORY_UPDATED", c.name, "Sửa Story Fragment"); toast("Đã lưu story"); }); });
    const nc = $("#newCard"); if (nc) nc.onclick = () => { if (!forbid("editCards")) toast("Form thêm thẻ: tên, hệ, rarity, art, story VI/EN (chi tiết ở FRD-10)"); };
    document.querySelectorAll("[data-odd]").forEach((i) => (i.oninput = () => {
      const v = versions[versions.length - 1]; v.odds[i.dataset.odd] = +i.value || 0;
      const s = sum(v.odds); const el = $("#sum"); el.textContent = s + "%"; el.style.color = s === 100 ? "var(--ok)" : "var(--danger)";
    }));
    const so = $("#submitOdds"); if (so) so.onclick = () => {
      if (forbid("oddsMake")) return;
      const v = versions[versions.length - 1];
      if (sum(v.odds) !== 100) return toast(`Tổng phải đúng 100.00% <code class="err">DROP_RATE_SUM_INVALID</code>`, true);
      if (new Date($("#effFrom").value) < new Date("2026-10-06")) return toast(`Thời điểm hiệu lực ở quá khứ <code class="err">EFFECTIVE_TIME_IN_PAST</code>`, true);
      v.status = "pending"; v.by = me; log("ODDS_SUBMITTED", "Awakening Standard " + v.version, "Gửi duyệt"); route(); toast("Đã gửi duyệt");
    };
    const ao = $("#approveOdds"); if (ao) ao.onclick = () => {
      const v = versions[versions.length - 1];
      if (v.by === me) return toast(`Người tạo không được tự duyệt <code class="err">SELF_APPROVAL_FORBIDDEN</code>`, true);
      if (forbid("oddsApprove")) return;
      v.status = "approved"; log("ODDS_APPROVED", "Awakening Standard " + v.version, `Hiệu lực từ ${v.from}`); route(); toast(`Đã duyệt ${v.version}; tự hiệu lực lúc ${v.from}`);
    };
    const ro = $("#rejectOdds"); if (ro) ro.onclick = () => { if (forbid("oddsApprove")) return; const v = versions[versions.length - 1]; v.status = "rejected"; log("ODDS_REJECTED", "Awakening Standard " + v.version, ""); route(); };
    const nd = $("#newDraft"); if (nd) nd.onclick = () => { if (forbid("oddsMake")) return; const n = versions.length + 2; versions.push({ version: "v" + n, odds: { ...active.odds }, from: "2026-12-01 00:00", by: me, status: "draft" }); route(); };
    all("[data-econ]", (e) => {
      if (forbid("econMake")) return;
      const [k, v] = econ[+e.dataset.econ];
      modal(`<h3>Version mới — ${k}</h3><label>Giá trị mới<input value="${v}" id="ev"></label><label>Hiệu lực từ<input type="datetime-local" id="ef" value="2026-11-01T00:00"></label><small>Cần một Economy Manager khác hoặc Super Admin duyệt.</small>`, () => {
        if (new Date($("#ef").value) < new Date("2026-10-06")) { toast(`<code class="err">EFFECTIVE_TIME_IN_PAST</code>`, true); return false; }
        log("ECON_PARAM_DRAFT", k, `${v} → ${$("#ev").value}`); toast("Đã tạo version, chờ duyệt");
      });
    });
    const ncp = $("#newComp"); if (ncp) ncp.onclick = () => {
      if (forbid("compMake")) return;
      modal(`<h3>Yêu cầu bồi thường</h3><label>Tài khoản<input id="ca" value="acc_9c21"></label><label>Số Coin<input id="cn" type="number" value="500"></label><label>Mã ticket (bắt buộc)<input id="ct"></label>`, () => {
        if (!$("#ct").value.trim()) { toast(`Thiếu mã ticket <code class="err">TICKET_REQUIRED</code>`, true); return false; }
        comps.push({ id: "CMP-" + (12 + comps.length), acc: $("#ca").value, amount: +$("#cn").value, ticket: $("#ct").value, by: who(), status: "pending" });
        log("COMPENSATION_CREATED", $("#ca").value, `${$("#cn").value} Coin · ${$("#ct").value}`); route();
      });
    };
    all("[data-approvecomp]", (e) => { if (forbid("compApprove")) return; const c = comps.find((x) => x.id === e.dataset.approvecomp); c.status = "approved"; log("COMPENSATION_APPROVED", c.acc, `${c.amount} Coin · ${c.ticket}`); route(); toast(`Đã cộng ${c.amount} Coin`); });
    const gg = $("#grantGem"); if (gg) gg.onclick = () => { toast(`Server từ chối: <code class="err">GEM_GRANT_FORBIDDEN</code>`, true); log("GEM_GRANT_DENIED", "acc_9c21", "Thử cộng Gem trực tiếp"); };
  }
  $("#role").innerHTML = Object.entries(USERS).map(([k, u]) => `<option value="${k}" ${k === me ? "selected" : ""}>${u.name} — ${u.role}</option>`).join("");
  $("#role").onchange = (e) => { me = e.target.value; route(); toast(`Đang xem với vai trò ${who()}`); };
  window.addEventListener("hashchange", route);
  route();
})();
</script>
</body>
</html>
